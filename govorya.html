<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Говоря и планирам</title>
<link rel="stylesheet" href="maxi-common.css">
<script src="maxi-common.js"></script>
<style>
  .wide{ width:100%; max-width:1100px; }
  /* ---------- AAC ---------- */
  .strip{
    display:flex; align-items:center; gap:0.5rem; width:100%; max-width:1100px;
    background:#fff; border-radius:20px; padding:0.5rem; box-shadow:var(--shadow); min-height:clamp(74px,11vw,96px);
  }
  .strip-words{ flex:1; display:flex; flex-wrap:wrap; gap:0.4rem; align-items:center; min-height:56px; }
  .strip-words:empty::before{ content:'Натисни картинки, за да направиш изречение'; color:#98a4b0; font-weight:700; padding-left:0.4rem; }
  .strip-chip{ display:flex; align-items:center; gap:0.3rem; background:#eef6ff; border-radius:12px; padding:0.3rem 0.6rem; font-weight:800; font-size:calc(1.1rem * var(--ts)); }
  .strip-chip .e{ font-size:1.6rem; }
  .strip button{ border:none; border-radius:14px; cursor:pointer; font-weight:800; min-width:56px; min-height:56px; font-size:1.4rem; }
  .strip .say{ background:#4f9350; color:#fff; padding:0 1rem; font-size:calc(1.1rem * var(--ts)); }
  .strip .del{ background:#fdecea; }
  .cats{ display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:center; }
  .cat{
    border:3px solid transparent; border-radius:16px; padding:0.5rem 0.9rem; cursor:pointer; font-weight:800;
    font-size:calc(1rem * var(--ts)); background:#fff; box-shadow:var(--shadow);
  }
  .cat.active{ border-color:var(--ink); }
  .aac-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(clamp(110px,15vw,150px), 1fr)); gap:clamp(0.5rem,1.4vw,0.9rem); width:100%; max-width:1100px; }
  .aac-btn{
    position:relative; border:none; border-radius:20px; background:#fff; cursor:pointer; box-shadow:var(--shadow);
    aspect-ratio:1/1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem; padding:0.4rem;
    border-bottom:6px solid var(--catcol, #5da8e8);
  }
  .aac-btn:active{ transform:scale(0.95); }
  .aac-btn .e{ font-size:clamp(2.6rem,6.5vw,3.8rem); line-height:1.1; }
  .aac-btn .t{ font-weight:800; font-size:calc(clamp(0.95rem,2vw,1.2rem) * var(--ts)); text-align:center; }
  .aac-btn .x{
    position:absolute; top:4px; right:4px; width:34px; height:34px; border-radius:50%; border:none; background:#c0392b; color:#fff;
    font-weight:900; cursor:pointer; display:none;
  }
  .editing .aac-btn .x{ display:block; }
  .aac-add{ border:3px dashed #b8c2cc; background:#f8fafc; box-shadow:none; }
  .edit-bar{ display:flex; gap:0.5rem; justify-content:flex-end; width:100%; max-width:1100px; }
  /* ---------- График ---------- */
  .now-next{ display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; width:100%; max-width:1000px; }
  .now{
    flex:2 1 320px; background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:1rem;
    display:flex; flex-direction:column; align-items:center; gap:0.4rem; border:5px solid #4f9350;
  }
  .next{ flex:1 1 200px; background:#fff; border-radius:24px; box-shadow:var(--shadow); padding:1rem; display:flex; flex-direction:column; align-items:center; gap:0.3rem; opacity:0.85; }
  .nn-label{ font-weight:900; color:var(--ink-soft); letter-spacing:0.05em; }
  .now .e{ font-size:clamp(4.5rem,13vw,7rem); line-height:1.1; }
  .next .e{ font-size:clamp(2.6rem,7vw,4rem); line-height:1.1; }
  .now .t{ font-size:calc(clamp(1.5rem,4vw,2.2rem) * var(--ts)); font-weight:900; }
  .next .t{ font-size:calc(1.2rem * var(--ts)); font-weight:800; }
  .steps{ display:flex; gap:0.5rem; overflow-x:auto; width:100%; max-width:1100px; padding:0.4rem 0.2rem 0.8rem; }
  .step{
    flex:0 0 auto; width:clamp(92px,12vw,120px); border:3px solid var(--line); border-radius:18px; background:#fff; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:0.2rem; padding:0.5rem 0.3rem; position:relative;
  }
  .step .e{ font-size:clamp(2rem,5vw,2.8rem); }
  .step .t{ font-size:calc(0.85rem * var(--ts)); font-weight:800; text-align:center; }
  .step.done{ background:var(--ok-bg); border-color:var(--ok); }
  .step.done::after{ content:'✓'; position:absolute; top:4px; right:8px; color:var(--ok); font-weight:900; font-size:1.3rem; }
  .step.current{ border-color:#3498db; box-shadow:0 0 0 4px rgba(52,152,219,0.2); }
  .step-tools{ display:none; gap:0.2rem; }
  .editing .step-tools{ display:flex; }
  .step-tools button{ border:none; border-radius:8px; background:#f2f5f8; cursor:pointer; font-size:0.9rem; padding:0.2rem 0.4rem; }
  .preset-grid{ display:flex; flex-wrap:wrap; gap:0.4rem; }
  .preset-grid button{ border:2px solid var(--line); background:#fff; border-radius:12px; padding:0.3rem 0.5rem; cursor:pointer; font-size:1rem; }
  /* ---------- Емоции ---------- */
  .feel-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(clamp(120px,18vw,170px),1fr)); gap:clamp(0.6rem,1.6vw,1rem); width:100%; max-width:900px; }
  .feel{
    border:3px solid transparent; border-radius:24px; background:#fff; box-shadow:var(--shadow); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:0.2rem; padding:0.8rem 0.4rem;
  }
  .feel .e{ font-size:clamp(3.2rem,8vw,4.6rem); line-height:1.1; }
  .feel .t{ font-weight:800; font-size:calc(1.05rem * var(--ts)); }
  .feel.sel{ border-color:#f2c14e; background:#fff8e6; }
  .feel-reply{ text-align:center; font-size:calc(1.3rem * var(--ts)); font-weight:800; min-height:1.5em; }
  /* ---------- Таймер ---------- */
  .timer-wrap{ display:flex; flex-direction:column; align-items:center; gap:0.8rem; }
  .timer-svg{ width:clamp(240px,48vw,420px); height:auto; }
  .timer-left{ font-size:calc(clamp(1.8rem,5vw,2.6rem) * var(--ts)); font-weight:900; font-variant-numeric:tabular-nums; }
  .timer-label{ font-size:calc(clamp(1.3rem,3.4vw,1.9rem) * var(--ts)); font-weight:900; min-height:1.3em; }
  .chips{ display:flex; gap:0.5rem; flex-wrap:wrap; justify-content:center; }
  .chip{ border:2px solid var(--line); background:#fff; border-radius:999px; padding:0.5rem 1rem; font-weight:800; cursor:pointer; font-size:calc(1rem * var(--ts)); }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
</style>
</head>
<body>

<header class="mx-top">
  <div class="mx-title">💬 Говоря и планирам</div>
  <span class="mx-badge">⭐ <span id="mx-stars">0</span></span>
  <span class="mx-badge">🔥 <span id="mx-streak">0</span></span>
  <button id="mx-back" class="mx-pill" hidden onclick="goMenu()">↩ Игри</button>
</header>

<section id="menu" class="mx-screen active">
  <h1 class="mx-h1">Говоря и планирам 💬</h1>
  <p class="mx-sub">Избери</p>
  <div class="mx-tiles">
    <button class="mx-tile g2" onclick="openAAC()"><span class="i">🗣️</span><span class="l">Моето табло</span><span class="s">Кажи с картинки</span></button>
    <button class="mx-tile g4" onclick="openGrafik()"><span class="i">📅</span><span class="l">Моят ден</span><span class="s">Сега и после</span></button>
    <button class="mx-tile g8" onclick="openFeel()"><span class="i">💛</span><span class="l">Как се чувствам?</span><span class="s">Кажи ми</span></button>
    <button class="mx-tile g7" onclick="openMode('emocii')"><span class="i">😀😢</span><span class="l">Познай емоцията</span><span class="s">Кое лице е…?</span></button>
    <button class="mx-tile g3" onclick="openTimer()"><span class="i">⏳</span><span class="l">Таймер</span><span class="s">Колко време остава?</span></button>
  </div>
</section>

<!-- AAC табло -->
<section id="aac" class="mx-screen">
  <div class="strip">
    <div class="strip-words" id="strip"></div>
    <button class="del" onclick="stripBack()" aria-label="Махни последното">⌫</button>
    <button class="del" onclick="stripClear()" aria-label="Изчисти">✕</button>
    <button class="say" onclick="stripSay()">▶ Кажи</button>
  </div>
  <div class="cats" id="cats"></div>
  <div class="edit-bar"><button class="mx-pill light" id="aacEditBtn" onclick="toggleAacEdit()">✏️ Промени таблото</button></div>
  <div class="aac-grid" id="aacGrid"></div>
</section>

<!-- Дневен график -->
<section id="grafik" class="mx-screen">
  <div class="now-next">
    <div class="now"><span class="nn-label">СЕГА</span><span class="e" id="nowE"></span><span class="t" id="nowT"></span>
      <button class="mx-btn green" id="nowDone" onclick="markCurrentDone()">✓ Готово</button></div>
    <div class="next"><span class="nn-label">ПОСЛЕ</span><span class="e" id="nextE"></span><span class="t" id="nextT"></span></div>
  </div>
  <div class="steps" id="steps"></div>
  <div class="mx-row">
    <button class="mx-pill light" onclick="resetDay()">↺ Нов ден</button>
    <button class="mx-pill light" id="grafikEditBtn" onclick="toggleGrafikEdit()">✏️ Промени деня</button>
    <button class="mx-pill light" id="grafikAddBtn" onclick="openStepModal()" hidden>＋ Добави стъпка</button>
  </div>
</section>

<!-- Как се чувствам -->
<section id="feel" class="mx-screen">
  <h1 class="mx-h1">Как се чувстваш сега?</h1>
  <div class="feel-grid" id="feelGrid"></div>
  <div class="feel-reply" id="feelReply"></div>
  <div class="mx-row" id="feelHelp" hidden>
    <button class="mx-btn purple" onclick="goBreath()">🌬️ Да подишаме заедно</button>
    <button class="mx-btn" onclick="openAAC('chuvstva')">🗣️ Кажи на някого</button>
  </div>
</section>

<!-- Визуален таймер -->
<section id="timer" class="mx-screen">
  <div class="chips" id="timerMins"></div>
  <div class="chips" id="timerLabels"></div>
  <div class="timer-wrap">
    <div class="timer-label" id="timerLabel"></div>
    <svg class="timer-svg" viewBox="0 0 300 300" id="timerSvg" role="img" aria-label="таймер"></svg>
    <div class="timer-left" id="timerLeft"></div>
    <div class="mx-row">
      <button class="mx-btn green" id="timerStart" onclick="timerToggle()">▶ Старт</button>
      <button class="mx-btn gray" onclick="timerReset()">↺ Отначало</button>
      <button class="mx-pill light" id="timerShowBtn" onclick="toggleTimeText()">🔢 Покажи минутите</button>
    </div>
  </div>
</section>

<!-- Игра „Познай емоцията“ -->
<section id="play" class="mx-screen">
  <div class="mx-levels" id="levels"></div>
  <div class="mx-card">
    <div class="mx-prompt"><span id="prompt"></span><button class="mx-say" onclick="sayPrompt()" aria-label="Кажи пак">🔊</button></div>
    <div id="area" style="display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%;"></div>
    <div id="answer"></div>
    <div id="keypad"></div>
    <div class="mx-feedback" id="fb"></div>
    <div class="mx-row">
      <button class="mx-btn orange" id="hintBtn" onclick="hint()" hidden>💡 Подсказка</button>
      <button class="mx-btn green" id="nextBtn" onclick="newRound()" hidden>Следваща ▶</button>
    </div>
  </div>
</section>

<!-- Диалог за нов бутон / нова стъпка -->
<div class="mx-modal" id="addModal">
  <div class="box">
    <h3 id="addTitle">Нов бутон</h3>
    <label>Картинка (емоджи)<input class="mx-input" id="addEmoji" maxlength="8" placeholder="напр. 🍉"></label>
    <label>Думи<input class="mx-input" id="addText" maxlength="40" placeholder="напр. диня"></label>
    <div id="addPresets" class="preset-grid"></div>
    <div class="mx-row"><button class="mx-btn gray" onclick="closeAdd()">Отказ</button><button class="mx-btn green" id="addOk">Добави</button></div>
  </div>
</div>

<script>
const M = window.Maxi;
const store = M.createStore('maxiGovorya_v1');
const $ = (id) => document.getElementById(id);
const ex = store.rec.extra;
let G;

/* ================= AAC табло ================= */
const CATS = [
  { key:'osnovni', name:'⭐ Основни', col:'#5da8e8', items:[
    ['🙋','Искам'],['🙅','Не искам'],['✅','Да'],['❌','Не'],['➕','Още'],['✋','Стоп'],['🆘','Помощ'],['🚽','Тоалетна'],
    ['🤕','Боли ме'],['🙏','Моля'],['💐','Благодаря'],['👋','Здравей'],['🏁','Готово'],['⏳','Чакай'],['🤗','Прегръдка'],['🔇','Твърде е шумно']] },
  { key:'hrana', name:'🍽️ Храна', col:'#8fbf7a', items:[
    ['💧','вода'],['🥛','мляко'],['🧃','сок'],['🍞','хляб'],['🍎','ябълка'],['🍌','банан'],['🍪','бисквита'],['🥣','супа'],
    ['🍝','макарони'],['🍕','пица'],['🧀','сирене'],['🥚','яйце'],['🍦','сладолед'],['🍇','грозде']] },
  { key:'chuvstva', name:'💛 Чувства', col:'#f2c14e', items:[
    ['😀','Весело ми е'],['😢','Тъжно ми е'],['😠','Ядосвам се'],['😨','Страх ме е'],['😴','Спи ми се'],['🤒','Не се чувствам добре'],
    ['😌','Спокойно ми е'],['🥱','Скучно ми е'],['🥵','Горещо ми е'],['🥶','Студено ми е']] },
  { key:'hora', name:'👪 Хора', col:'#e8845d', items:[
    ['👩','мама'],['👨','татко'],['👵','баба'],['👴','дядо'],['👦','брат'],['👧','сестра'],['👩‍🏫','учителката'],['🧑‍⚕️','лекаря'],['🧒','приятел']] },
  { key:'mesta', name:'🏠 Места и занимания', col:'#b28be0', items:[
    ['🏠','вкъщи'],['🏫','на училище'],['🌳','в парка'],['🛝','на площадката'],['🛒','в магазина'],['🚗','с колата'],['🛁','баня'],
    ['🛏️','да спя'],['📺','телевизия'],['📖','книжка'],['🎨','да рисувам'],['🎵','музика'],['🎮','да играя'],['🚶','разходка']] }
];
ex.aac = ex.aac || { custom: [], hidden: [] };
let aacCat = 'osnovni', aacEdit = false, strip = [];
const idOf = (cat, e, t) => cat + '|' + e + '|' + t;

function openAAC(cat){ if(cat) aacCat = cat; M.show('aac'); renderAAC(); }
function renderAAC(){
  $('cats').innerHTML = CATS.map(c => `<button class="cat${c.key === aacCat ? ' active' : ''}" style="background:${c.key === aacCat ? c.col + '33' : '#fff'}" onclick="aacCat='${c.key}';renderAAC()">${c.name}</button>`).join('');
  const cat = CATS.find(c => c.key === aacCat);
  const items = cat.items.map(([e, t]) => ({ e, t, id: idOf(cat.key, e, t) }))
    .concat(ex.aac.custom.filter(c => c.cat === cat.key).map(c => ({ e: c.e, t: c.t, id: c.id, custom: true })))
    .filter(it => !ex.aac.hidden.includes(it.id));
  const grid = $('aacGrid');
  grid.classList.toggle('editing', aacEdit);
  grid.innerHTML = '';
  items.forEach(it => {
    const b = document.createElement('button');
    b.className = 'aac-btn';
    b.style.setProperty('--catcol', cat.col);
    b.innerHTML = `<span class="e">${M.escapeHtml(it.e)}</span><span class="t">${M.escapeHtml(it.t)}</span><span class="x" role="button" aria-label="Скрий">✕</span>`;
    b.onclick = (ev) => {
      if(aacEdit && ev.target.classList.contains('x')){
        if(it.custom) ex.aac.custom = ex.aac.custom.filter(c => c.id !== it.id);
        else ex.aac.hidden.push(it.id);
        store.save(); renderAAC(); return;
      }
      M.speak(it.t, { rate: 0.95 });
      strip.push(it);
      renderStrip();
    };
    grid.appendChild(b);
  });
  if(aacEdit){
    const add = document.createElement('button');
    add.className = 'aac-btn aac-add';
    add.innerHTML = '<span class="e">➕</span><span class="t">Нов бутон</span>';
    add.onclick = () => openAddModal('Нов бутон в „' + cat.name + '“', [], (e, t) => {
      ex.aac.custom.push({ cat: cat.key, e, t, id: 'c' + Date.now() });
      store.save(); renderAAC();
    });
    grid.appendChild(add);
    if(ex.aac.hidden.some(h => h.startsWith(cat.key + '|'))){
      const restore = document.createElement('button');
      restore.className = 'aac-btn aac-add';
      restore.innerHTML = '<span class="e">↩️</span><span class="t">Върни скритите</span>';
      restore.onclick = () => { ex.aac.hidden = ex.aac.hidden.filter(h => !h.startsWith(cat.key + '|')); store.save(); renderAAC(); };
      grid.appendChild(restore);
    }
  }
}
function renderStrip(){
  $('strip').innerHTML = strip.map(it => `<span class="strip-chip"><span class="e">${M.escapeHtml(it.e)}</span>${M.escapeHtml(it.t)}</span>`).join('');
}
function stripBack(){ strip.pop(); renderStrip(); }
function stripClear(){ strip = []; renderStrip(); }
function stripSay(){
  if(!strip.length) return;
  const sentence = strip.map(it => it.t).join(' ');
  M.speak(sentence, { rate: 0.9 });
  store.log('aac', sentence);
}
function toggleAacEdit(){
  if(aacEdit){ aacEdit = false; $('aacEditBtn').textContent = '✏️ Промени таблото'; renderAAC(); return; }
  M.parentGate(() => { aacEdit = true; $('aacEditBtn').textContent = '✓ Готово с промените'; renderAAC(); }, 'Промяна на таблото (за родители)');
}

/* ================= Диалог „добави“ ================= */
function openAddModal(title, presets, onOk){
  $('addTitle').textContent = title;
  $('addEmoji').value = ''; $('addText').value = '';
  $('addPresets').innerHTML = '';
  presets.forEach(([e, t]) => {
    const b = document.createElement('button');
    b.textContent = e + ' ' + t;
    b.onclick = () => { $('addEmoji').value = e; $('addText').value = t; };
    $('addPresets').appendChild(b);
  });
  $('addOk').onclick = () => {
    const e = $('addEmoji').value.trim() || '⭐';
    const t = $('addText').value.trim();
    if(!t){ $('addText').focus(); return; }
    closeAdd(); onOk(e, t);
  };
  $('addModal').classList.add('open');
}
function closeAdd(){ $('addModal').classList.remove('open'); }

/* ================= Дневен график ================= */
const DEFAULT_DAY = [['🛏️','Ставам'],['🚽','Тоалетна'],['🪥','Мия зъбите'],['👕','Обличам се'],['🥣','Закуска'],['🎒','Училище'],
  ['🍽️','Обяд'],['😴','Почивка'],['🌳','Игра навън'],['🍲','Вечеря'],['🛁','Баня'],['📖','Приказка'],['🌙','Сън']];
const STEP_PRESETS = [['🛏️','Ставам'],['🚽','Тоалетна'],['🪥','Мия зъбите'],['🧼','Мия ръцете'],['👕','Обличам се'],['🥣','Закуска'],
  ['🎒','Училище'],['🏫','Градина'],['🧑‍⚕️','Терапия'],['🗣️','Логопед'],['🍽️','Обяд'],['😴','Почивка'],['🌳','Игра навън'],['🛝','Площадка'],
  ['📚','Домашно'],['📱','Таблет'],['🛒','Магазин'],['🍎','Закуска (плод)'],['🍲','Вечеря'],['🛁','Баня'],['📖','Приказка'],['🌙','Сън'],['🚗','Пътуване'],['👵','При баба']];
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
ex.grafik = ex.grafik || { items: DEFAULT_DAY.map(([e, t], i) => ({ id: 's' + i, e, t })), done: { date: today(), ids: [] } };
let grafikEdit = false;

function openGrafik(){
  if(ex.grafik.done.date !== today()){ ex.grafik.done = { date: today(), ids: [] }; store.save(); }
  M.show('grafik'); renderGrafik();
}
function renderGrafik(){
  const g = ex.grafik, done = g.done.ids;
  const curIdx = g.items.findIndex(it => !done.includes(it.id));
  const cur = g.items[curIdx], nxt = g.items.slice(curIdx + 1).find(it => !done.includes(it.id));
  $('nowE').textContent = cur ? cur.e : '🎉';
  $('nowT').textContent = cur ? cur.t : 'Всичко е готово!';
  $('nowDone').hidden = !cur;
  $('nextE').textContent = nxt ? nxt.e : '🌟';
  $('nextT').textContent = nxt ? nxt.t : (cur ? 'Край на деня' : 'Браво!');
  const box = $('steps');
  box.classList.toggle('editing', grafikEdit);
  box.innerHTML = '';
  g.items.forEach((it, i) => {
    const b = document.createElement('div');
    b.className = 'step' + (done.includes(it.id) ? ' done' : '') + (cur && it.id === cur.id ? ' current' : '');
    b.innerHTML = `<span class="e">${M.escapeHtml(it.e)}</span><span class="t">${M.escapeHtml(it.t)}</span>
      <span class="step-tools"><button data-a="l">◀</button><button data-a="r">▶</button><button data-a="x">✕</button></span>`;
    b.onclick = (ev) => {
      const a = ev.target.dataset && ev.target.dataset.a;
      if(grafikEdit && a){
        if(a === 'x') g.items.splice(i, 1);
        if(a === 'l' && i > 0) [g.items[i - 1], g.items[i]] = [g.items[i], g.items[i - 1]];
        if(a === 'r' && i < g.items.length - 1) [g.items[i + 1], g.items[i]] = [g.items[i], g.items[i + 1]];
        store.save(); renderGrafik(); return;
      }
      if(done.includes(it.id)) g.done.ids = done.filter(x => x !== it.id);
      else { g.done.ids.push(it.id); M.click(); }
      store.save(); renderGrafik();
      M.speak(it.t);
    };
    box.appendChild(b);
  });
  const curEl = box.querySelector('.current');
  if(curEl) curEl.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}
function markCurrentDone(){
  const g = ex.grafik;
  const cur = g.items.find(it => !g.done.ids.includes(it.id));
  if(!cur) return;
  g.done.ids.push(cur.id);
  store.save();
  const nxt = g.items.find(it => !g.done.ids.includes(it.id));
  M.good();
  if(!nxt){
    store.award(1);
    store.log('grafik', 'Целият ден е готов (' + g.items.length + ' стъпки)');
    M.confetti(16);
    M.speakSeq(['Браво! Направи всичко днес!', 'Нова звезда!']);
  } else {
    M.speak('Браво! Сега: ' + nxt.t + '.');
  }
  renderGrafik();
}
function resetDay(){ ex.grafik.done = { date: today(), ids: [] }; store.save(); renderGrafik(); }
function toggleGrafikEdit(){
  if(grafikEdit){ grafikEdit = false; $('grafikEditBtn').textContent = '✏️ Промени деня'; $('grafikAddBtn').hidden = true; renderGrafik(); return; }
  M.parentGate(() => { grafikEdit = true; $('grafikEditBtn').textContent = '✓ Готово с промените'; $('grafikAddBtn').hidden = false; renderGrafik(); }, 'Промяна на деня (за родители)');
}
function openStepModal(){
  openAddModal('Нова стъпка', STEP_PRESETS, (e, t) => { ex.grafik.items.push({ id: 's' + Date.now(), e, t }); store.save(); renderGrafik(); });
}

/* ================= Как се чувствам ================= */
const FEELINGS = [['😀','Радост','Весело ми е'],['😢','Тъга','Тъжно ми е'],['😠','Гняв','Ядосан съм'],['😨','Страх','Страх ме е'],
  ['😴','Умора','Уморен съм'],['😲','Изненада','Изненадан съм'],['😌','Спокойствие','Спокоен съм'],['🥰','Обич','Обичам'],['🤒','Болка','Боли ме']];
const HARD = ['Тъга','Гняв','Страх','Болка'];
function openFeel(){
  M.show('feel');
  $('feelReply').textContent = ''; $('feelHelp').hidden = true;
  $('feelGrid').innerHTML = '';
  FEELINGS.forEach(([e, noun]) => {
    const b = document.createElement('button');
    b.className = 'feel';
    b.innerHTML = `<span class="e">${e}</span><span class="t">${noun}</span>`;
    b.onclick = () => {
      M.$$('.feel').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      const hard = HARD.includes(noun);
      $('feelReply').textContent = hard ? 'Благодаря, че ми каза 💛 Всичко е наред да се чувстваш така.' : 'Благодаря, че сподели 💛';
      $('feelHelp').hidden = !hard;
      M.speakSeq(['Чувствам ' + noun.toLowerCase() + '.', hard ? 'Благодаря, че ми каза.' : 'Благодаря, че сподели.']);
      store.log('chuvstva', e + ' ' + noun);
    };
    $('feelGrid').appendChild(b);
  });
  M.speak('Как се чувстваш сега?');
}
function goBreath(){
  const q = '?hubUser=' + encodeURIComponent(M.user) + '#dishane';
  window.location.href = 'dvizhenie.html' + q;
}

/* ================= Визуален таймер ================= */
const MINS = [1, 2, 3, 5, 10, 15, 20];
const TLABELS = ['', 'Игра', 'Таблет', 'Хранене', 'Домашно', 'Почивка', 'Чакаме'];
let tTotal = (ex.timerMin || 5) * 60000, tLeft = tTotal, tEnd = 0, tRun = false, tLabel = '', tShowText = !!ex.timerShowText, tTick = null, wakeLock = null;
function openTimer(){
  M.show('timer');
  $('timerMins').innerHTML = MINS.map(m => `<button class="chip${m * 60000 === tTotal ? ' active' : ''}" onclick="setTimerMin(${m})">${m} мин</button>`).join('');
  $('timerLabels').innerHTML = TLABELS.map(l => `<button class="chip${l === tLabel ? ' active' : ''}" onclick="setTimerLabel('${l}')">${l || 'Без надпис'}</button>`).join('');
  drawTimer();
}
function setTimerMin(m){ ex.timerMin = m; store.save(); tTotal = m * 60000; timerReset(); openTimer(); }
function setTimerLabel(l){ tLabel = l; openTimer(); }
function toggleTimeText(){ tShowText = !tShowText; ex.timerShowText = tShowText; store.save(); drawTimer(); }
function drawTimer(){
  const f = Math.max(0, tLeft / tTotal);
  const c = 150, r = 130;
  let sector = '';
  if(f >= 0.9999) sector = `<circle cx="${c}" cy="${c}" r="${r}" fill="#e74c3c"/>`;
  else if(f > 0){
    const a = f * 2 * Math.PI;
    const x = c + r * Math.sin(a), y = c - r * Math.cos(a);
    sector = `<path d="M ${c} ${c} L ${c} ${c - r} A ${r} ${r} 0 ${f > 0.5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="#e74c3c"/>`;
  }
  let ticks = '';
  for(let i = 0; i < 12; i++){
    const a = i * Math.PI / 6;
    ticks += `<line x1="${c + 138 * Math.sin(a)}" y1="${c - 138 * Math.cos(a)}" x2="${c + 146 * Math.sin(a)}" y2="${c - 146 * Math.cos(a)}" stroke="#2c3e50" stroke-width="3"/>`;
  }
  $('timerSvg').innerHTML = `<circle cx="${c}" cy="${c}" r="146" fill="#fff" stroke="#2c3e50" stroke-width="4"/>${ticks}${sector}<circle cx="${c}" cy="${c}" r="10" fill="#2c3e50"/>`;
  const s = Math.ceil(tLeft / 1000);
  $('timerLeft').textContent = tShowText ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : '';
  $('timerShowBtn').textContent = tShowText ? '🙈 Скрий минутите' : '🔢 Покажи минутите';
  $('timerLabel').textContent = tLabel ? (tLeft > 0 ? 'Още малко: ' + tLabel : tLabel + ' — край!') : (tLeft > 0 ? '' : 'Времето свърши!');
  $('timerStart').textContent = tRun ? '⏸ Пауза' : '▶ Старт';
}
function timerToggle(){
  if(tLeft <= 0) timerReset();
  if(tRun){ tRun = false; tLeft = Math.max(0, tEnd - Date.now()); clearInterval(tTick); releaseWake(); }
  else {
    tRun = true; tEnd = Date.now() + tLeft;
    tTick = setInterval(() => {
      tLeft = Math.max(0, tEnd - Date.now());
      if(tLeft <= 0){ tRun = false; clearInterval(tTick); releaseWake(); M.chime(); M.speak(tLabel ? 'Времето свърши. ' + tLabel + ' приключи.' : 'Времето свърши!'); store.log('taimer', (tTotal / 60000) + ' мин' + (tLabel ? ' – ' + tLabel : '')); }
      drawTimer();
    }, 250);
    if(navigator.wakeLock && navigator.wakeLock.request){ navigator.wakeLock.request('screen').then(w => wakeLock = w).catch(() => {}); }
    if(tLabel) M.speak(tLabel + ': ' + M.num(tTotal / 60000, 'f') + (tTotal === 60000 ? ' минута.' : ' минути.'));
  }
  drawTimer();
}
function timerReset(){ tRun = false; clearInterval(tTick); releaseWake(); tLeft = tTotal; drawTimer(); }
function releaseWake(){ if(wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; } }

/* ================= Игра „Познай емоцията“ ================= */
const FACES = [['😀','весело','радост'],['😢','тъжно','тъга'],['😠','ядосано','гняв'],['😨','уплашено','страх'],
  ['😲','изненадано','изненада'],['😴','сънливо','умора'],['😌','спокойно','спокойствие'],['🥰','влюбено','обич']];
const MODES = {
  emocii: {
    levels: ['3 лица', '4 лица'],
    round(){
      const n = G.level + 3;
      const set = M.sample(FACES, n);
      const target = set[0];
      if(Math.random() < 0.5){
        G.setPrompt('Кое лице е ' + target[1] + '?');
        optionButtons(M.shuffle(set).map(f => ({ html: `<span class="e">${f[0]}</span>`, value: f[0], label: f[1], speakOk: 'Това лице е ' + target[1] + '.', speakBad: 'Това лице е ' + f[1] + '.' })), target[0], 'Кое е ' + target[1]);
      } else {
        G.setPrompt('Как се чувства това лице?');
        document.getElementById('area').insertAdjacentHTML('beforeend', `<div class="mx-big">${target[0]}</div>`);
        optionButtons(M.shuffle(set).map(f => ({ html: f[1], value: f[1], speakOk: 'Лицето е ' + target[1] + '.' })), target[1], target[0] + ' → ' + target[1]);
      }
    }
  }
};
G = M.createGame(store, MODES);
const baseGoMenu = G.goMenu;
window.goMenu = function(){
  if(tRun){ tRun = false; clearInterval(tTick); releaseWake(); tLeft = tTotal; }
  if(aacEdit) toggleAacEdit();
  if(grafikEdit) toggleGrafikEdit();
  closeAdd();
  baseGoMenu();
};
M.show('menu');
</script>
