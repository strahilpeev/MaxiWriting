<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Пръстче и спокойствие</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="maxi-common.css">
<script src="maxi-points.js"></script>
<script src="maxi-common.js"></script>
<style>
  .trace-wrap{ position:relative; width:100%; display:flex; justify-content:center; }
  #traceCanvas{ touch-action:none; background:#fbfdff; border-radius:22px; border:3px solid var(--line); max-width:100%; }
  /* Дишане */
  #breath{ justify-content:center; }
  .breath-stage{ position:relative; width:min(78vw, 60vh, 460px); aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; }
  .breath-ring{ position:absolute; inset:0; border-radius:50%; border:4px dashed #b8d4ee; }
  .breath-ball{
    width:100%; height:100%; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #d9f1ff, #7cc3f0 60%, #4a9fd8);
    box-shadow:0 10px 40px rgba(74,159,216,0.35); transform:scale(0.35); will-change:transform;
  }
  .breath-text{ position:absolute; font-size:calc(clamp(1.6rem,5vw,2.6rem) * var(--ts)); font-weight:900; color:#1f4e79; text-align:center; }
  .breath-count{ font-weight:800; color:var(--ink-soft); font-size:calc(1.1rem * var(--ts)); }
  /* Балончета и светлинки */
  #bubbles, #lights{ padding:0; overflow:hidden; }
  .field{ position:absolute; inset:0; overflow:hidden; touch-action:none; }
  .bubble{
    position:absolute; border-radius:50%; border:none; padding:0; cursor:pointer;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.15) 35%, var(--bc) 100%);
    box-shadow:inset 0 0 12px rgba(255,255,255,0.6), 0 4px 14px rgba(0,0,0,0.08);
  }
  .burst{ position:absolute; pointer-events:none; font-size:1.6rem; animation:mx-fly .7s ease-out forwards; }
  .field-info{
    position:absolute; left:50%; bottom:1rem; transform:translateX(-50%); z-index:3;
    background:rgba(255,255,255,0.85); border-radius:999px; padding:0.5rem 1.1rem; font-weight:800; font-size:calc(1rem * var(--ts));
  }
  #lights{ background:#101a2b; }
  body.dark-top .mx-title{ color:#fff; }
  #lightsCanvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  /* Свържи точките */
  .dots-svg{ width:min(88vw, 54vh, 520px); height:auto; touch-action:none; background:#fbfdff; border-radius:22px; border:3px solid var(--line); }
  .dots-svg .dot{ cursor:pointer; }
  .dots-svg .dot .vis{ fill:#2c3e50; transform-box:fill-box; transform-origin:center; }
  .dots-svg .dot.done .vis{ fill:#2e9e5b; }
  .dots-svg .dot.nextdot .vis{ fill:#e67e22; animation:dot-pulse 1s ease-in-out infinite; }
  .dots-svg .dot.bad .vis{ fill:var(--bad); }
  .dots-svg text{ font-family:'Segoe UI', Arial, sans-serif; font-weight:800; font-size:6.5px; fill:#2c3e50; pointer-events:none; }
  .dots-svg .shape-fill{ opacity:0; transition:opacity .8s ease; }
  .dots-svg .shape-fill.show{ opacity:0.55; }
  @keyframes dot-pulse{ 50%{ transform:scale(1.6); } }
  /* Рисувай свободно */
  #draw{ gap:0.6rem; padding-bottom:0.8rem; overflow:hidden; }
  .draw-wrap{ flex:1 1 auto; width:100%; max-width:1200px; min-height:0; position:relative; }
  #drawCanvas{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; background:#fff; border-radius:22px;
    border:3px solid var(--line); box-shadow:var(--shadow); cursor:crosshair; }
  .draw-tools{ flex:0 0 auto; width:100%; max-width:1200px; display:flex; flex-wrap:wrap; gap:0.55rem; align-items:center; justify-content:center; }
  .draw-colors, .draw-sizes, .draw-acts{ display:flex; flex-wrap:wrap; gap:0.45rem; align-items:center; justify-content:center; }
  .draw-sep{ width:2px; align-self:stretch; background:var(--line); border-radius:2px; }
  .swatch{ width:clamp(50px,6.4vw,72px); height:clamp(50px,6.4vw,72px); border-radius:50%; border:4px solid #fff; background:var(--c);
    box-shadow:0 0 0 2px var(--line), var(--shadow); cursor:pointer; padding:0; transition:transform .12s; }
  .swatch.on{ transform:scale(1.15); box-shadow:0 0 0 5px #2c3e50, var(--shadow); }
  .tool{ min-width:clamp(64px,8vw,86px); height:clamp(54px,7vw,72px); border-radius:20px; border:3px solid var(--line); background:#fff;
    font-weight:800; font-size:calc(0.85rem * var(--ts)); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:0.1rem; box-shadow:var(--shadow); padding:0.2rem 0.5rem; line-height:1.1; }
  .tool .ti{ font-size:1.7rem; line-height:1; }
  .tool.on{ border-color:#2c3e50; background:#fff4d6; transform:scale(1.06); }
  .tool:active, .swatch:active{ transform:scale(0.94); }
  .tool.size .dot{ display:block; border-radius:50%; background:#2c3e50; }
  .tool.armed{ background:#ffe0e0; border-color:#c0392b; }
</style>
</head>
<body>

<header class="mx-top">
  <div class="mx-title">✋ Пръстче и спокойствие</div>
  <span class="mx-badge">⭐ <span id="mx-stars">0</span></span>
  <span class="mx-badge">🔥 <span id="mx-streak">0</span></span>
  <button id="mx-back" class="mx-pill" hidden onclick="goMenu()">↩ Игри</button>
</header>

<section id="menu" class="mx-screen active">
  <h1 class="mx-h1">Пръстче и спокойствие ✋</h1>
  <p class="mx-sub">Избери</p>
  <div class="mx-section-title">✍️ Писане с пръстче</div>
  <div class="mx-tiles">
    <button class="mx-tile g2" onclick="openMode('prosledi')"><span class="i">✍️</span><span class="l">Проследи с пръстче</span><span class="s">Цифри и букви</span></button>
    <button class="mx-tile g8" onclick="openMode('tochki')"><span class="i">1·2·3</span><span class="l">Свържи точките</span><span class="s">По ред до картинка</span></button>
    <button class="mx-tile g4" onclick="openMode('konturi')"><span class="i">🏠</span><span class="l">Проследи предмет</span><span class="s">Къща, топка, рибка…</span></button>
  </div>
  <div class="mx-section-title">🎨 Рисуване</div>
  <div class="mx-tiles">
    <button class="mx-tile g7" onclick="openDraw('risuvane')"><span class="i">🎨</span><span class="l">Рисувай свободно</span><span class="s">Цветове и гума</span></button>
  </div>
  <div class="mx-section-title">🌿 Спокойно кътче</div>
  <div class="mx-tiles">
    <button class="mx-tile g6" onclick="openBreath()"><span class="i">🌬️</span><span class="l">Дишай с мен</span><span class="s">Вдишай… издишай…</span></button>
    <button class="mx-tile g5" onclick="openBubbles()"><span class="i">🫧</span><span class="l">Балончета</span><span class="s">Пукни ги леко</span></button>
    <button class="mx-tile g1" onclick="openLights()"><span class="i">✨</span><span class="l">Светлинки</span><span class="s">Рисувай със светлина</span></button>
  </div>
</section>

<section id="play" class="mx-screen">
  <div class="mx-levels" id="levels"></div>
  <div class="mx-card">
    <div class="mx-prompt"><span id="prompt"></span><button class="mx-say" onclick="sayPrompt()" aria-label="Кажи пак">🔊</button></div>
    <div id="area" style="display:flex;flex-direction:column;align-items:center;gap:1rem;width:100%;"></div>
    <div id="answer"></div>
    <div id="keypad"></div>
    <div class="mx-feedback" id="fb"></div>
    <div class="mx-row">
      <button class="mx-btn orange" id="hintBtn" onclick="hint()" hidden>💡 Подсказка</button>
      <button class="mx-btn green" id="nextBtn" onclick="newRound()" hidden>Следваща ▶</button>
    </div>
  </div>
</section>

<section id="breath" class="mx-screen">
  <div class="breath-stage">
    <div class="breath-ring"></div>
    <div class="breath-ball" id="breathBall"></div>
    <div class="breath-text" id="breathText">Готов ли си?</div>
  </div>
  <div class="breath-count" id="breathCount"></div>
  <div class="mx-row">
    <button class="mx-btn green" id="breathBtn" onclick="breathToggle()">▶ Започни</button>
    <button class="mx-pill light" id="breathVoiceBtn" onclick="breathVoiceToggle()"></button>
  </div>
</section>

<section id="bubbles" class="mx-screen">
  <div class="field" id="bubbleField"></div>
  <div class="field-info" id="bubbleInfo">🫧 0</div>
</section>

<section id="draw" class="mx-screen">
  <div class="draw-wrap"><canvas id="drawCanvas" aria-label="Лист за рисуване"></canvas></div>
  <div class="draw-tools">
    <div class="draw-colors" id="drawColors"></div>
    <span class="draw-sep" aria-hidden="true"></span>
    <div class="draw-sizes" id="drawSizes"></div>
    <span class="draw-sep" aria-hidden="true"></span>
    <div class="draw-acts">
      <button class="tool" id="eraserBtn" type="button" onclick="drawEraser()"><span class="ti">🧽</span>Гума</button>
      <button class="tool" type="button" onclick="drawUndo()"><span class="ti">↩️</span>Назад</button>
      <button class="tool" id="clearBtn" type="button" onclick="drawClear()"><span class="ti">🗑️</span>Нов лист</button>
      <button class="tool" type="button" onclick="drawSave()"><span class="ti">💾</span>Запази</button>
    </div>
  </div>
</section>

<section id="lights" class="mx-screen">
  <canvas id="lightsCanvas"></canvas>
  <div class="field-info">✨ Движи пръстче по екрана</div>
</section>

<script>
const M = window.Maxi;
const store = M.createStore('maxiDvizhenie_v1');
const $ = (id) => document.getElementById(id);
const ex = store.rec.extra;
let G;

/* ================= Проследи с пръстче ================= */
const SETS = [
  '0123456789'.split(''),
  'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЮЯ'.split(''),
  'абвгдежзийклмнопрстуфхцчшщъюя'.split('')
];
const VOW = 'аеиоуъюя';
const letterSound = (ch) => { const l = ch.toLowerCase(); return VOW.includes(l) ? l : l + 'ъ'; };
const glyphName = (ch) => /[0-9]/.test(ch) ? 'цифрата ' + M.num(+ch) : 'буквата ' + letterSound(ch);

/* ================= Свържи точките ================= */
function starPts(k){
  return Array.from({ length: 2 * k }, (x, i) => {
    const r = i % 2 ? 19 : 44, a = (i * 180 / k - 90) * Math.PI / 180;
    return [50 + r * Math.cos(a), 53 + r * Math.sin(a)];
  });
}
function heartPts(n){
  return Array.from({ length: n }, (x, i) => {
    const t = 2 * Math.PI * i / n;
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    return [50 + hx * 2.6, 46 + hy * 2.6];
  });
}
const circlePts = (n) => Array.from({ length: n }, (x, i) => { const a = (i * 360 / n - 90) * Math.PI / 180; return [50 + 40 * Math.cos(a), 50 + 40 * Math.sin(a)]; });
const DOT_SHAPES = [
  [
    { n:'триъгълник', col:'#e74c3c', p:[[50,10],[90,85],[10,85]] },
    { n:'квадрат', col:'#3498db', p:[[18,18],[82,18],[82,82],[18,82]] },
    { n:'ромб', col:'#8e44ad', p:[[50,8],[90,50],[50,92],[10,50]] },
    { n:'къщичка', col:'#e67e22', p:[[20,90],[20,45],[50,12],[80,45],[80,90]] }
  ],
  [
    { n:'стрелка', col:'#27ae60', p:[[8,40],[58,40],[58,16],[92,50],[58,84],[58,60],[8,60]] },
    { n:'рибка', col:'#3498db', p:[[8,50],[28,30],[58,24],[78,42],[94,26],[94,74],[78,58],[58,76],[28,70]] },
    { n:'звезда', col:'#f1c40f', p:starPts(5) },
    { n:'сърце', col:'#e74c3c', p:heartPts(10) }
  ],
  [
    { n:'елха', col:'#27ae60', p:[[50,6],[72,32],[61,32],[82,58],[67,58],[92,88],[8,88],[33,58],[18,58],[39,32],[28,32]] },
    { n:'кръг', col:'#3498db', p:circlePts(12) },
    { n:'звезда с шест лъча', col:'#f1c40f', p:starPts(6) },
    { n:'звезда със седем лъча', col:'#e67e22', p:starPts(7) }
  ]
];
let lastDotShape = null;

/* ================= Проследи предмет =================
   Контурите са SVG пътеки в квадрат 100×100. Детето минава с пръстче по линиите;
   броим колко от линиите е покрило и колко от рисунката е близо до тях (както при буквите). */
const OUTLINES = [
  [ // Лесни — една линия
    { n:'топка', a:'топката', col:'#e74c3c', d:'M50,12 A38,38 0 1,1 49.9,12 Z' },
    { n:'къща', a:'къщата', col:'#e67e22', d:'M20,90 L20,46 L50,14 L80,46 L80,90 Z' },
    { n:'сърце', a:'сърцето', col:'#e84393', d:'M50,86 C14,62 4,42 18,26 C30,13 45,18 50,32 C55,18 70,13 82,26 C96,42 86,62 50,86 Z' },
    { n:'балон', a:'балона', col:'#9b59b6', d:'M50,8 C73,8 83,27 81,44 C79,62 63,74 50,74 C37,74 21,62 19,44 C17,27 27,8 50,8 Z M50,74 Q42,84 50,94' },
    { n:'ябълка', a:'ябълката', col:'#c0392b', d:'M50,30 C36,18 12,24 14,50 C16,76 36,93 50,86 C64,93 84,76 86,50 C88,24 64,18 50,30 Z M50,30 Q51,18 58,9' },
    { n:'яйце', a:'яйцето', col:'#f1c40f', d:'M50,10 C72,10 84,40 84,60 C84,80 68,92 50,92 C32,92 16,80 16,60 C16,40 28,10 50,10 Z' }
  ],
  [ // Средни — няколко части
    { n:'къщичка с врата', a:'къщичката', col:'#e67e22', d:'M20,90 L20,46 L50,14 L80,46 L80,90 Z M42,90 L42,66 L58,66 L58,90 M28,52 L38,52 L38,62 L28,62 Z' },
    { n:'слънце', a:'слънцето', col:'#f1c40f', d:'M50,30 A20,20 0 1,1 49.9,30 Z M50,6 L50,20 M50,80 L50,94 M6,50 L20,50 M80,50 L94,50 M19,19 L29,29 M71,71 L81,81 M81,19 L71,29 M29,71 L19,81' },
    { n:'рибка', a:'рибката', col:'#3498db', d:'M12,50 Q40,20 70,50 Q40,80 12,50 Z M70,50 L92,30 L92,70 Z M28,44 A3,3 0 1,1 27.9,44 Z' },
    { n:'облак', a:'облака', col:'#74b9ff', d:'M26,72 C10,72 10,50 26,48 C26,30 46,26 53,40 C60,24 84,28 81,48 C96,50 93,72 78,72 Z' },
    { n:'звезда', a:'звездата', col:'#f39c12', d:'M50,8 L61,38 L93,38 L67,57 L77,88 L50,69 L23,88 L33,57 L7,38 L39,38 Z' },
    { n:'лист', a:'листа', col:'#27ae60', d:'M16,84 C16,42 48,14 86,14 C86,52 58,84 16,84 Z M16,84 L66,34' }
  ],
  [ // Трудни — много линии
    { n:'кола', a:'колата', col:'#e74c3c', d:'M8,66 L8,50 L24,47 L35,30 L68,30 L80,47 L93,51 L93,66 Z M28,58 A9,9 0 1,1 27.9,58 Z M74,58 A9,9 0 1,1 73.9,58 Z' },
    { n:'цвете', a:'цветето', col:'#e84393', d:'M50,22 A9,9 0 1,1 49.9,22 Z M50,8 A8,8 0 1,1 49.9,8 Z M64,22 A8,8 0 1,1 63.9,22 Z M36,22 A8,8 0 1,1 35.9,22 Z M50,40 L50,92 M50,74 Q66,58 76,66 Q66,78 50,74' },
    { n:'дърво', a:'дървото', col:'#27ae60', d:'M50,8 C66,8 80,20 78,34 C90,40 88,60 72,62 C66,70 34,70 28,62 C12,60 10,40 22,34 C20,20 34,8 50,8 Z M43,68 L43,92 L57,92 L57,68' },
    { n:'чадър', a:'чадъра', col:'#8e44ad', d:'M8,50 Q50,2 92,50 Q81,42 71,50 Q60,42 50,50 Q40,42 29,50 Q19,42 8,50 Z M50,50 L50,84 Q50,93 42,93 Q35,93 35,86' },
    { n:'лодка', a:'лодката', col:'#2980b9', d:'M8,62 L92,62 L76,84 L24,84 Z M50,62 L50,10 M50,14 L82,56 L50,56' },
    { n:'сладолед', a:'сладоледа', col:'#fd79a8', d:'M32,50 L50,94 L68,50 Z M30,50 C22,22 78,22 70,50 Z' }
  ]
];
let lastOutline = null;

const MODES = {
  tochki: {
    levels: ['До 5', 'До 10', 'До 14'],
    round(){
      const pool = DOT_SHAPES[G.level].filter(s => s !== lastDotShape);
      const sh = M.pick(pool);
      lastDotShape = sh;
      const pts = sh.p, n = pts.length;
      G.setPrompt('Свържи точките от 1 до ' + n, 'Свържи точките по ред. Започни от едно.');
      const cx = pts.reduce((s, p) => s + p[0], 0) / n, cy = pts.reduce((s, p) => s + p[1], 0) / n;
      const f = (v) => v.toFixed(1);
      let dotsSvg = '';
      pts.forEach(([x, y], i) => {
        const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1;
        const lx = x + dx / d * 7.5, ly = y + dy / d * 7.5 + 2.2;
        dotsSvg += `<g class="dot" data-i="${i}"><circle cx="${f(x)}" cy="${f(y)}" r="7.5" fill="transparent"/><circle class="vis" cx="${f(x)}" cy="${f(y)}" r="2.6"/><text x="${f(lx)}" y="${f(ly)}" text-anchor="middle">${i + 1}</text></g>`;
      });
      const area = $('area');
      area.insertAdjacentHTML('beforeend', `<svg class="dots-svg" viewBox="-6 -6 112 112" role="img" aria-label="свържи точките">
        <polygon class="shape-fill" points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="${sh.col}"/>
        <g id="dotLines" stroke="#3498db" stroke-width="2.2" stroke-linecap="round"></g>${dotsSvg}</svg>`);
      const svg = M.$('.dots-svg', area);
      const dots = M.$$('.dot', svg);
      const lines = M.$('#dotLines', svg);
      let next = 0, dragging = false;
      const markNext = (show) => { dots.forEach(d => d.classList.remove('nextdot')); if(show && next < n) dots[next].classList.add('nextdot'); };
      const showNext = () => markNext(G.level === 0 || next === 0);
      const line = (a, b) => lines.insertAdjacentHTML('beforeend', `<line x1="${f(pts[a][0])}" y1="${f(pts[a][1])}" x2="${f(pts[b][0])}" y2="${f(pts[b][1])}"/>`);
      const hit = (i, fromDrag) => {
        if(G.done()) return;
        if(i === next){
          dots[i].classList.add('done');
          if(next > 0) line(next - 1, i);
          next++;
          M.tone(520 + next * 30, 0.12, 'triangle');
          if(next === n){
            line(n - 1, 0);
            markNext(false);
            M.$('.shape-fill', svg).classList.add('show');
            complete(sh.n, n + ' точки', 'Получи се ' + sh.n + '!');
          } else {
            showNext();
            if(!fromDrag) M.speak(M.num(next + 1), { rate: 1.1 });
          }
        } else if(!fromDrag && !dots[i].classList.contains('done')){
          G.mistakes++;
          M.bad();
          dots[i].classList.add('bad'); setTimeout(() => dots[i].classList.remove('bad'), 400);
          M.speak('Търси числото ' + M.num(next + 1) + '.');
        }
      };
      const dotAt = (e) => { const el = document.elementFromPoint(e.clientX, e.clientY); const d = el && el.closest && el.closest('.dot'); return d ? +d.dataset.i : -1; };
      svg.addEventListener('pointerdown', (e) => { dragging = true; try{ svg.setPointerCapture(e.pointerId); }catch(x){} const i = dotAt(e); if(i >= 0) hit(i, false); });
      svg.addEventListener('pointermove', (e) => { if(!dragging) return; const i = dotAt(e); if(i >= 0) hit(i, true); });
      ['pointerup', 'pointercancel'].forEach(t => svg.addEventListener(t, () => { dragging = false; }));
      showNext();
      G.setHint(() => { markNext(true); M.speak('Следващото е ' + M.num(next + 1) + '.'); });
    }
  },
  konturi: {
    levels: ['Лесни', 'Средни', 'Трудни'],
    round(){
      const sh = M.pick(OUTLINES[G.level].filter(o => o !== lastOutline));
      lastOutline = sh;
      G.setPrompt('Проследи с пръстче: ' + sh.n, 'Проследи с пръстче ' + sh.a + '.');
      const area = $('area');
      const wrap = document.createElement('div'); wrap.className = 'trace-wrap';
      const cv = document.createElement('canvas'); cv.id = 'traceCanvas';
      wrap.appendChild(cv); area.appendChild(wrap);
      const cssW = Math.min(area.clientWidth || 600, 640), cssH = Math.round(Math.min(cssW * 0.85, window.innerHeight * 0.52));
      const dpr = window.devicePixelRatio || 1;
      cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
      cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
      const ctx = cv.getContext('2d');
      ctx.scale(dpr, dpr);
      // пътеката (100×100) се вписва в листа
      const k = Math.min(cssW, cssH) * 0.9 / 100, ox = (cssW - 100 * k) / 2, oy = (cssH - 100 * k) / 2;
      const path = new Path2D(sh.d);
      const brush = Math.max(16, Math.min(cssW, cssH) * 0.055);
      const mk = () => { const c = document.createElement('canvas'); c.width = cssW; c.height = cssH; return c; };
      const strokeShape = (c, width, style) => {
        c.save(); c.translate(ox, oy); c.scale(k, k);
        c.lineWidth = width / k; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = style || '#000';
        c.stroke(path); c.restore();
      };
      const mask = mk(), mctx = mask.getContext('2d');   // самата линия
      const tol = mk(), tctx = tol.getContext('2d');     // линията с толеранс
      const user = mk(), uctx = user.getContext('2d');   // рисунката на детето
      strokeShape(mctx, brush * 0.5);
      strokeShape(tctx, brush * 2.3);
      let solved = false;
      const drawGuide = () => {
        ctx.clearRect(0, 0, cssW, cssH);
        if(solved){ ctx.save(); ctx.translate(ox, oy); ctx.scale(k, k); ctx.globalAlpha = 0.45; ctx.fillStyle = sh.col; ctx.fill(path, 'evenodd'); ctx.restore(); }
        strokeShape(ctx, brush, '#e3ecf5');
        ctx.save(); ctx.setLineDash([10, 8]); strokeShape(ctx, 3, '#9bb3cc'); ctx.restore();
        ctx.drawImage(user, 0, 0, cssW, cssH);
      };
      const step = 4;
      const md = mctx.getImageData(0, 0, cssW, cssH).data, td = tctx.getImageData(0, 0, cssW, cssH).data;
      let lineCells = 0;
      for(let y = 0; y < cssH; y += step) for(let x = 0; x < cssW; x += step) if(md[(y * cssW + x) * 4 + 3] > 128) lineCells++;
      const evaluate = () => {
        const ud = uctx.getImageData(0, 0, cssW, cssH).data;
        let covered = 0, userCells = 0, inside = 0;
        for(let y = 0; y < cssH; y += step) for(let x = 0; x < cssW; x += step){
          const i = (y * cssW + x) * 4 + 3;
          const u = ud[i] > 60;
          if(md[i] > 128 && u) covered++;
          if(u){ userCells++; if(td[i] > 60) inside++; }
        }
        return { cover: lineCells ? covered / lineCells : 0, acc: userCells ? inside / userCells : 0, drawn: userCells };
      };
      const win = (r) => {
        solved = true;
        uctx.globalCompositeOperation = 'source-in'; uctx.fillStyle = '#2e9e5b'; uctx.fillRect(0, 0, cssW, cssH); uctx.globalCompositeOperation = 'source-over';
        drawGuide();
        complete(sh.n, Math.round(r.cover * 100) + '%', 'Получи се ' + sh.n + '!');
      };
      drawGuide();
      let drawing = false, last = null;
      const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cssW / r.width, y: (e.clientY - r.top) * cssH / r.height }; };
      const line = (a, b) => {
        uctx.strokeStyle = '#3498db'; uctx.lineWidth = brush; uctx.lineCap = 'round'; uctx.lineJoin = 'round';
        uctx.beginPath(); uctx.moveTo(a.x, a.y); uctx.lineTo(b.x, b.y); uctx.stroke();
      };
      cv.addEventListener('pointerdown', (e) => { if(G.done()) return; cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e); line(last, last); drawGuide(); });
      cv.addEventListener('pointermove', (e) => { if(!drawing) return; const p = pos(e); line(last, p); last = p; drawGuide(); });
      const end = () => {
        if(!drawing) return;
        drawing = false;
        const r = evaluate();
        if(r.cover >= 0.7 && r.acc >= 0.7) win(r);
        else if(r.acc < 0.5 && r.drawn > 60){ G.mistakes++; M.bad(); M.feedback($('fb'), 'Опитай по-близо до линията 🙂', 'bad'); M.speak('Опитай по-близо до линиите.'); }
      };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
      const tools = document.createElement('div'); tools.className = 'mx-row';
      const clear = document.createElement('button'); clear.className = 'mx-btn gray'; clear.textContent = '🧽 Изчисти';
      clear.onclick = () => { if(G.done()) return; uctx.clearRect(0, 0, cssW, cssH); drawGuide(); M.feedback($('fb'), ''); };
      const check = document.createElement('button'); check.className = 'mx-btn green'; check.textContent = 'Готово ✓';
      check.onclick = () => {
        if(G.done()) return;
        const r = evaluate();
        if(r.cover >= 0.55 && r.acc >= 0.6) win(r);
        else { M.feedback($('fb'), 'Още малко — мини по всички линии', 'bad'); M.speak('Още малко. Мини по всички линии.'); }
      };
      tools.appendChild(clear); tools.appendChild(check);
      area.appendChild(tools);
    }
  },
  prosledi: {
    levels: ['Цифри', 'Главни букви', 'Малки букви'],
    round(){
      const ch = M.pick(SETS[G.level]);
      G.setPrompt('Проследи с пръстче: ' + ch, 'Проследи с пръстче ' + glyphName(ch) + '.');
      const area = $('area');
      const wrap = document.createElement('div'); wrap.className = 'trace-wrap';
      const cv = document.createElement('canvas'); cv.id = 'traceCanvas';
      wrap.appendChild(cv); area.appendChild(wrap);
      const cssW = Math.min(area.clientWidth || 600, 640), cssH = Math.round(Math.min(cssW * 0.85, window.innerHeight * 0.5));
      const dpr = window.devicePixelRatio || 1;

      const fontPx = Math.round(cssH * 0.82);

      const brush = Math.max(18, fontPx * 0.11);

      const mask = mk(cssW, cssH), mctx = mask.getContext('2d');
      const tol = mk(cssW, cssH), tctx = tol.getContext('2d');
      const user = mk(cssW, cssH), uctx = user.getContext('2d');
      [mctx, tctx, ctx].forEach(c => { c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; });
      const gx = cssW / 2, gy = cssH / 2 + fontPx * 0.04;
      mctx.fillStyle = '#000'; mctx.fillText(ch, gx, gy);
      tctx.fillStyle = '#000'; tctx.strokeStyle = '#000'; tctx.lineWidth = brush * 1.6; tctx.lineJoin = 'round';
      tctx.fillText(ch, gx, gy); tctx.strokeText(ch, gx, gy);
      const drawGuide = () => {
        ctx.clearRect(0, 0, cssW, cssH);
        ctx.fillStyle = '#e3ecf5'; ctx.fillText(ch, gx, gy);
        ctx.setLineDash([10, 8]); ctx.strokeStyle = '#9bb3cc'; ctx.lineWidth = 3; ctx.strokeText(ch, gx, gy); ctx.setLineDash([]);
        ctx.drawImage(user, 0, 0, cssW, cssH);
      };
      const step = 4;
      const md = mctx.getImageData(0, 0, cssW, cssH).data, td = tctx.getImageData(0, 0, cssW, cssH).data;
      let glyphCells = 0;
      for(let y = 0; y < cssH; y += step) for(let x = 0; x < cssW; x += step) if(md[(y * cssW + x) * 4 + 3] > 128) glyphCells++;
      const evaluate = () => {
        const ud = uctx.getImageData(0, 0, cssW, cssH).data;
        let covered = 0, userCells = 0, inside = 0;
        for(let y = 0; y < cssH; y += step) for(let x = 0; x < cssW; x += step){
          const i = (y * cssW + x) * 4 + 3;
          const u = ud[i] > 60;
          if(md[i] > 128 && u) covered++;
          if(u){ userCells++; if(td[i] > 60) inside++; }
        }
        return { cover: glyphCells ? covered / glyphCells : 0, acc: userCells ? inside / userCells : 0, drawn: userCells };
      };
      drawGuide();
      let drawing = false, last = null;
      const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cssW / r.width, y: (e.clientY - r.top) * cssH / r.height }; };
      const line = (a, b) => {
        uctx.strokeStyle = '#3498db'; uctx.lineWidth = brush; uctx.lineCap = 'round'; uctx.lineJoin = 'round';
        uctx.beginPath(); uctx.moveTo(a.x, a.y); uctx.lineTo(b.x, b.y); uctx.stroke();
      };
      cv.addEventListener('pointerdown', (e) => { if(G.done()) return; cv.setPointerCapture(e.pointerId); drawing = true; last = pos(e); line(last, last); drawGuide(); });
      cv.addEventListener('pointermove', (e) => { if(!drawing) return; const p = pos(e); line(last, p); last = p; drawGuide(); });
      const end = () => {
        if(!drawing) return;
        drawing = false;
        const r = evaluate();
        if(r.cover >= 0.62 && r.acc >= 0.7){ uctx.globalCompositeOperation = 'source-in'; uctx.fillStyle = '#2e9e5b'; uctx.fillRect(0, 0, cssW, cssH); uctx.globalCompositeOperation = 'source-over'; drawGuide(); complete(ch, Math.round(r.cover * 100) + '%', glyphName(ch)); }
        else if(r.acc < 0.5 && r.drawn > 60){ G.mistakes++; M.bad(); M.feedback($('fb'), 'Опитай по-близо до ' + (/[0-9]/.test(ch) ? 'цифрата' : 'буквата') + ' 🙂', 'bad'); M.speak('Опитай по-близо до линиите.'); }
      };
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('pointerleave', end);
      const tools = document.createElement('div'); tools.className = 'mx-row';
      const clear = document.createElement('button'); clear.className = 'mx-btn gray'; clear.textContent = '🧽 Изчисти';
      clear.onclick = () => { if(G.done()) return; uctx.clearRect(0, 0, cssW, cssH); drawGuide(); M.feedback($('fb'), ''); };
      const check = document.createElement('button'); check.className = 'mx-btn green'; check.textContent = 'Готово ✓';
      check.onclick = () => {
        if(G.done()) return;
        const r = evaluate();
        if(r.cover >= 0.5 && r.acc >= 0.6) complete(ch, Math.round(r.cover * 100) + '%', glyphName(ch));
        else { M.feedback($('fb'), 'Още малко — мини по цялата ' + (/[0-9]/.test(ch) ? 'цифра' : 'буква'), 'bad'); M.speak('Още малко. Мини по цялата линия.'); }
      };
      tools.appendChild(clear); tools.appendChild(check);
      area.appendChild(tools);
    }
  }
};

/* ================= Дишай с мен ================= */
const PHASES = [['Вдишай…', 4000, 0.35, 1], ['Задръж', 1500, 1, 1], ['Издишай…', 5000, 1, 0.35]];
let bRun = false, bCycles = 0, bRaf = null;
ex.breathVoice = ex.breathVoice !== false;
function openBreath(){ M.show('breath'); bCycles = 0; renderBreathInfo(); $('breathText').textContent = 'Готов ли си?'; $('breathBall').style.transform = 'scale(0.35)'; }
function renderBreathInfo(){
  $('breathCount').textContent = bCycles ? 'Дишания: ' + bCycles + ' от 5' : '5 бавни дишания';
  $('breathBtn').textContent = bRun ? '⏸ Спри' : '▶ Започни';
  $('breathVoiceBtn').textContent = ex.breathVoice ? '🔈 С глас' : '🔇 Без глас';
}
function breathVoiceToggle(){ ex.breathVoice = !ex.breathVoice; store.save(); renderBreathInfo(); }
function breathToggle(){
  if(bRun){ stopBreath(); return; }
  bRun = true; bCycles = 0; renderBreathInfo();
  let phase = 0, t0 = performance.now();
  const say = (i) => { if(ex.breathVoice) M.speak(PHASES[i][0].replace('…', ''), { rate: 0.7 }); };
  $('breathText').textContent = PHASES[0][0]; say(0);
  const tick = (now) => {
    if(!bRun || !$('breath').classList.contains('active')){ stopBreath(); return; }
    const [label, dur, from, to] = PHASES[phase];
    const k = Math.min(1, (now - t0) / dur);
    const e = 0.5 - Math.cos(Math.PI * k) / 2;
    $('breathBall').style.transform = 'scale(' + (from + (to - from) * e).toFixed(3) + ')';
    if(k >= 1){
      phase = (phase + 1) % PHASES.length;
      t0 = now;
      if(phase === 0){
        bCycles++; renderBreathInfo();
        if(bCycles >= 5){
          stopBreath();
          $('breathText').textContent = 'Браво 💙';
          store.log('dishane', '5 спокойни дишания');
          M.chime();
          M.speak('Браво. Справи се чудесно.', { rate: 0.8 });
          return;
        }
      }
      $('breathText').textContent = PHASES[phase][0]; say(phase);
    }
    bRaf = requestAnimationFrame(tick);
  };
  bRaf = requestAnimationFrame(tick);
}
function stopBreath(){ bRun = false; if(bRaf) cancelAnimationFrame(bRaf); bRaf = null; renderBreathInfo(); }

/* ================= Балончета ================= */
const PENTA = [523, 587, 659, 784, 880, 1047];
const BCOLS = ['#4fa3e0', '#9575cd', '#26c6da', '#f06292', '#9ccc65', '#ffca28'];
let bubbles = [], bubRaf = null, popped = 0, lastSpawn = 0;
function openBubbles(){
  M.show('bubbles');
  popped = 0; $('bubbleInfo').textContent = '🫧 Пукни балончетата';
  $('bubbleField').innerHTML = ''; bubbles = [];
  let prev = performance.now();
  const loop = (now) => {
    if(!$('bubbles').classList.contains('active')){ bubRaf = null; return; }
    const dt = Math.min(50, now - prev) / 1000; prev = now;
    const field = $('bubbleField'), H = field.clientHeight, W = field.clientWidth;
    if(now - lastSpawn > (M.settings.reduceMotion ? 1600 : 900) && bubbles.length < 14){ lastSpawn = now; spawnBubble(W, H); }
    const speedK = M.settings.reduceMotion ? 0.5 : 1;
    bubbles = bubbles.filter(b => {
      b.y -= b.v * speedK * dt;
      b.t += dt;
      const x = b.x + Math.sin(b.t * b.w) * 18;
      b.el.style.transform = `translate(${x}px, ${b.y}px)`;
      if(b.y < -b.s - 10){ b.el.remove(); return false; }
      return true;
    });
    bubRaf = requestAnimationFrame(loop);
  };
  bubRaf = requestAnimationFrame(loop);
}
function spawnBubble(W, H){
  const s = M.randInt(70, 130);
  const el = document.createElement('button');
  el.className = 'bubble';
  el.style.width = el.style.height = s + 'px';
  el.style.setProperty('--bc', M.pick(BCOLS));
  el.setAttribute('aria-label', 'балонче');
  const b = { el, s, x: M.randInt(10, Math.max(20, W - s - 10)), y: H + 10, v: M.randInt(40, 80), t: Math.random() * 6, w: 0.8 + Math.random() };
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    popped++;
    $('bubbleInfo').textContent = '🫧 ' + popped;
    M.tone(M.pick(PENTA), 0.35, 'sine');
    const r = el.getBoundingClientRect(), fr = $('bubbleField').getBoundingClientRect();
    for(let i = 0; i < 5; i++){
      const p = document.createElement('span'); p.className = 'burst'; p.textContent = '✨';
      p.style.left = (r.left - fr.left + s / 2) + 'px'; p.style.top = (r.top - fr.top + s / 2) + 'px';
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px'); p.style.setProperty('--rot', (Math.random() * 180) + 'deg');
      $('bubbleField').appendChild(p); setTimeout(() => p.remove(), 700);
    }
    el.remove();
    bubbles = bubbles.filter(x => x !== b);
  });
  $('bubbleField').appendChild(el);
  bubbles.push(b);
}

/* ================= Рисувай свободно =================
   Голям бял лист, големи бутони за цвят, дебелина и гума. Рисува се с един или
   повече пръста; „Назад“ връща последната линия. Рисунката остава, докато детето
   е в играта (и при завъртане на таблета). */
const DRAW_COLORS = [
  ['#2c3e50', 'черно'], ['#e74c3c', 'червено'], ['#e67e22', 'оранжево'], ['#f1c40f', 'жълто'], ['#2ecc71', 'зелено'],
  ['#1e8449', 'тъмнозелено'], ['#3498db', 'синьо'], ['#1a3d8f', 'тъмносиньо'], ['#9b59b6', 'лилаво'], ['#fd79a8', 'розово'],
  ['#8d5524', 'кафяво'], ['#95a5a6', 'сиво']
];
const DRAW_SIZES = [[8, 'тънко'], [18, 'средно'], [34, 'дебело']];
const D = { color: DRAW_COLORS[1][0], size: 1, eraser: false, undo: [], strokes: 0, start: 0, used: false, ctx: null, w: 0, h: 0, pts: {} };
(function buildDrawTools(){
  $('drawColors').innerHTML = DRAW_COLORS.map(([c, n]) =>
    `<button class="swatch" type="button" style="--c:${c}" data-c="${c}" aria-label="${n}" title="${n}"></button>`).join('');
  $('drawSizes').innerHTML = DRAW_SIZES.map(([px, n], i) =>
    `<button class="tool size" type="button" data-i="${i}" aria-label="${n}"><span class="dot" style="width:${Math.min(34, px)}px;height:${Math.min(34, px)}px"></span>${n}</button>`).join('');
  M.$$('.swatch', $('drawColors')).forEach(b => b.onclick = () => { D.color = b.dataset.c; D.eraser = false; M.tone(660, 0.06, 'sine'); renderDrawTools(); });
  M.$$('.tool.size', $('drawSizes')).forEach(b => b.onclick = () => { D.size = +b.dataset.i; M.tone(560, 0.06, 'sine'); renderDrawTools(); });
})();
function renderDrawTools(){
  M.$$('.swatch', $('drawColors')).forEach(b => b.classList.toggle('on', !D.eraser && b.dataset.c === D.color));
  M.$$('.tool.size', $('drawSizes')).forEach(b => {
    b.classList.toggle('on', +b.dataset.i === D.size);
    b.querySelector('.dot').style.background = D.eraser ? '#fff' : D.color;
    b.querySelector('.dot').style.boxShadow = D.eraser ? '0 0 0 2px #2c3e50' : 'none';
  });
  $('eraserBtn').classList.toggle('on', D.eraser);
  $('drawCanvas').style.cursor = D.eraser ? 'cell' : 'crosshair';
}
function drawEraser(){ D.eraser = !D.eraser; M.tone(440, 0.06, 'sine'); renderDrawTools(); }
// Размерът на листа следва екрана; при промяна старата рисунка се пренася.
function sizeDrawCanvas(){
  const cv = $('drawCanvas'), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w || !h || (w === D.w && h === D.h && D.ctx)) return;
  let old = null;
  if(D.ctx && cv.width){ old = document.createElement('canvas'); old.width = cv.width; old.height = cv.height; old.getContext('2d').drawImage(cv, 0, 0); }
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  D.ctx = cv.getContext('2d'); D.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  D.ctx.lineCap = 'round'; D.ctx.lineJoin = 'round';
  if(old) D.ctx.drawImage(old, 0, 0, old.width, old.height, 0, 0, w, h);
  D.w = w; D.h = h; D.undo = [];
}
function openDraw(key){
  M.markSeen(key || 'risuvane');
  M.show('draw');
  D.start = Date.now(); D.strokes = 0;
  requestAnimationFrame(() => { sizeDrawCanvas(); renderDrawTools(); });
  if(!D.used){ D.used = true; M.speak('Избери цвят и рисувай.'); }
}
window.addEventListener('resize', () => { if($('draw').classList.contains('active')) sizeDrawCanvas(); });
function drawSnapshot(){
  const cv = $('drawCanvas');
  try{ D.undo.push(D.ctx.getImageData(0, 0, cv.width, cv.height)); }catch(e){}
  if(D.undo.length > 20) D.undo.shift();
}
function drawUndo(){
  const img = D.undo.pop();
  if(!img){ M.tone(220, 0.1, 'sine'); return; }
  D.ctx.putImageData(img, 0, 0);
  M.tone(480, 0.08, 'sine');
}
// „Нов лист“ иска второ докосване, за да не се изтрие рисунката случайно.
let clearArmed = null;
function drawClear(){
  const b = $('clearBtn');

    b.classList.add('armed'); b.lastChild.textContent = 'Сигурен ли си?';

function drawSave(){

(function(){
  const cv = $('drawCanvas');
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const seg = (a, b) => {
    const c = D.ctx;
    c.globalCompositeOperation = D.eraser ? 'destination-out' : 'source-over';
    c.strokeStyle = D.color;
    c.lineWidth = DRAW_SIZES[D.size][0] * (D.eraser ? 1.8 : 1);
    c.beginPath(); c.moveTo(a.x, a.y); c.lineTo(b.x, b.y); c.stroke();
    c.globalCompositeOperation = 'source-over';

    const p = pos(e); D.pts[e.pointerId] = p; seg(p, p); D.strokes++;
    e.preventDefault();
  });
  cv.addEventListener('pointermove', (e) => {
    const last = D.pts[e.pointerId]; if(!last) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    let prev = last;
    (evs.length ? evs : [e]).forEach(ev => { const p = pos(ev); seg(prev, p); prev = p; });
    D.pts[e.pointerId] = prev;
  });
  ['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, (e) => { delete D.pts[e.pointerId]; }));
})();

/* ================= Светлинки ================= */
let lctx = null, parts = [], lRaf = null, lStart = 0, lTouches = 0;
function openLights(){
  M.show('lights');
  document.body.classList.add('dark-top');
  const cv = $('lightsCanvas');
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  lctx = cv.getContext('2d'); lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  parts = []; lStart = Date.now(); lTouches = 0;
  const loop = () => {
    if(!$('lights').classList.contains('active')){ lRaf = null; return; }
    lctx.fillStyle = 'rgba(16,26,43,0.18)';
    lctx.fillRect(0, 0, cv.clientWidth, cv.clientHeight);
    lctx.globalCompositeOperation = 'lighter';
    parts = parts.filter(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.life -= 0.015;
      if(p.life <= 0) return false;
      const g = lctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `hsla(${p.h},100%,75%,${p.life})`); g.addColorStop(1, `hsla(${p.h},100%,60%,0)`);
      lctx.fillStyle = g; lctx.beginPath(); lctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); lctx.fill();
      return true;
    });
    lctx.globalCompositeOperation = 'source-over';
    lRaf = requestAnimationFrame(loop);
  };
  lRaf = requestAnimationFrame(loop);
}
(function(){
  const cv = $('lightsCanvas');
  let hue = 180;
  const add = (e) => {
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    hue = (hue + 3) % 360;
    for(let i = 0; i < 3; i++) parts.push({ x, y, vx: (Math.random() - 0.5) * 1.6, vy: (Math.random() - 0.5) * 1.6, r: 14 + Math.random() * 22, h: hue, life: 1 });
  };
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); lTouches++; M.tone(M.pick(PENTA) / 2, 0.5, 'sine'); add(e); });
  cv.addEventListener('pointermove', (e) => { if(e.buttons || e.pointerType === 'touch') add(e); });
})();

/* ================= Изход към менюто: спираме всичко и записваме ================= */
G = M.createGame(store, MODES);
const baseGoMenu = G.goMenu;
window.goMenu = function(){
  if($('bubbles').classList.contains('active') && popped) store.log('balonche', popped === 1 ? '1 пукнато балонче' : popped + ' пукнати балончета');
  if($('lights').classList.contains('active') && lTouches) store.log('svetlinki', Math.max(1, Math.round((Date.now() - lStart) / 60000)) + ' мин рисуване със светлина');
  if($('draw').classList.contains('active') && D.strokes) store.log('risuvane', Math.max(1, Math.round((Date.now() - D.start) / 60000)) + ' мин свободно рисуване');
  stopBreath();
  document.body.classList.remove('dark-top');
  baseGoMenu();
};
if(location.hash === '#dishane') openBreath();
else if(location.hash === '#risuvane') openDraw();
else M.show('menu');
