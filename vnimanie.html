<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Внимание и памет</title>
<link rel="stylesheet" href="maxi-common.css">
<script src="maxi-common.js"></script>
<style>
  /* Memory */
  .mem-grid{ display:grid; gap:clamp(0.4rem,1.4vw,0.8rem); width:100%; max-width:760px; }
  .mem-card{ perspective:600px; border:none; background:none; padding:0; cursor:pointer; aspect-ratio:1/1; }
  .mem-inner{ position:relative; width:100%; height:100%; transition:transform .35s ease; transform-style:preserve-3d; }
  .mem-card.open .mem-inner, .mem-card.matched .mem-inner{ transform:rotateY(180deg); }
  .mem-face{
    position:absolute; inset:0; border-radius:18px; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
  }
  .mem-back{ background:linear-gradient(160deg,#b28be0,#7a52b3); color:#fff; font-size:clamp(1.6rem,4vw,2.4rem); }
  .mem-front{ background:#fff; transform:rotateY(180deg); font-size:clamp(2rem,6vw,3.4rem); border:3px solid var(--line); }
  .mem-front.word{ font-size:calc(clamp(1rem,2.6vw,1.5rem) * var(--ts)); font-weight:900; padding:0.2rem; text-align:center; }
  .mem-card.matched .mem-front{ border-color:var(--ok); background:var(--ok-bg); }
  .moves{ font-weight:800; color:var(--ink-soft); }
  /* Сортиране */
  .sort-item{ font-size:clamp(4rem,12vw,6.5rem); line-height:1.1; min-height:1.2em; display:flex; align-items:center; justify-content:center; }
  .sort-item.small{ font-size:clamp(1.8rem,5vw,2.6rem); }
  .sort-item.bad{ animation:mx-shake .3s; }
  .baskets{ display:flex; gap:clamp(0.6rem,2vw,1.2rem); flex-wrap:wrap; justify-content:center; width:100%; }
  .basket{
    flex:1 1 200px; max-width:300px; min-height:clamp(150px,22vw,200px);
    border:4px solid var(--line); border-radius:24px; background:#f8fafc; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:0.3rem; padding:0.6rem;
  }
  .basket:active{ transform:scale(0.97); }
  .basket .bh{ font-size:clamp(2rem,5vw,2.8rem); }
  .basket .bl{ font-weight:900; font-size:calc(clamp(1.1rem,2.6vw,1.4rem) * var(--ts)); }
  .basket .bin{ display:flex; flex-wrap:wrap; justify-content:center; gap:0.2rem; font-size:1.6rem; }
  .progress-dots{ display:flex; gap:6px; }
  .progress-dots i{ width:14px; height:14px; border-radius:50%; background:#d7dee5; display:block; }
  .progress-dots i.on{ background:var(--ok); }
  /* Различното */
  .odd-grid{ display:grid; gap:clamp(0.3rem,1vw,0.6rem); width:100%; max-width:640px; }
  .odd-cell{
    aspect-ratio:1/1; border:3px solid var(--line); border-radius:16px; background:#fff; cursor:pointer;
    font-size:clamp(1.8rem,5.5vw,3.2rem); display:flex; align-items:center; justify-content:center; padding:0;
  }
  .odd-cell.ok{ border-color:var(--ok); background:var(--ok-bg); }
  .odd-cell.bad{ border-color:var(--bad); background:var(--bad-bg); animation:mx-shake .3s; }
  /* Какво липсва / Последователности */
  .show-row{ display:flex; gap:clamp(0.4rem,1.6vw,1rem); flex-wrap:wrap; justify-content:center; }
  .show-cell{
    width:clamp(86px,14vw,130px); height:clamp(86px,14vw,130px); border-radius:20px; background:#fff; border:3px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:clamp(2.6rem,7vw,4rem); box-shadow:0 3px 8px rgba(44,62,80,0.08);
  }
  .show-cell.q{ border-style:dashed; color:#b8c2cc; }
  .seq-slots{ display:flex; gap:0.6rem; flex-wrap:wrap; justify-content:center; }
  .seq-slot{
    width:clamp(110px,17vw,160px); min-height:clamp(120px,18vw,170px); border:3px dashed #b8c2cc; border-radius:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem; position:relative; padding:0.3rem;
  }
  .seq-slot .num{ position:absolute; top:6px; left:10px; font-weight:900; color:#b8c2cc; }
  .seq-slot.filled{ border-style:solid; border-color:var(--ok); background:var(--ok-bg); }
  .seq-card{
    width:clamp(110px,17vw,160px); min-height:clamp(120px,18vw,170px); border:3px solid var(--line); border-radius:20px; background:#fff;
    cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.2rem; padding:0.3rem;
    box-shadow:0 3px 8px rgba(44,62,80,0.08);
  }
  .seq-card.used{ visibility:hidden; }
  .seq-card.bad{ animation:mx-shake .3s; border-color:var(--bad); }
  .seq-e{ font-size:clamp(2.4rem,6vw,3.6rem); line-height:1.1; }
  .seq-t{ font-weight:800; font-size:calc(clamp(0.85rem,1.9vw,1.05rem) * var(--ts)); text-align:center; }
  /* Повтори реда */
  .simon{ display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:clamp(0.6rem,2vw,1rem); width:min(84vw, 52vh, 440px); }
  .pad{
    aspect-ratio:1/1; border:none; border-radius:28px; cursor:pointer; opacity:0.55;
    font-size:clamp(2rem,6vw,3.4rem); color:rgba(255,255,255,0.9); box-shadow:var(--shadow);
    transition:opacity .08s ease, transform .08s ease;
  }
  .pad.lit{ opacity:1; transform:scale(1.05); box-shadow:0 0 0 6px rgba(255,255,255,0.9), 0 0 30px 6px rgba(255,220,120,0.8); }
  .simon.watch .pad{ cursor:default; }
  /* Ляво и дясно */
  .lr-row{ display:flex; align-items:center; justify-content:center; gap:clamp(0.6rem,3vw,2rem); }
  .lr-cell{ width:clamp(90px,16vw,140px); height:clamp(90px,16vw,140px); display:flex; align-items:center; justify-content:center; font-size:clamp(3rem,9vw,5rem); }
  .lr-row.opts .mx-options{ flex-wrap:nowrap; }
  .mx-opt.ref{ border-color:#8e44ad; border-style:dashed; background:#f5edff; }
  .mx-opt.pulse{ animation:lr-pulse 0.8s ease 3; }
  @keyframes lr-pulse{ 50%{ transform:scale(1.12); border-color:#f39c12; } }
  /* Лабиринт */
  .maze{
    display:grid; width:min(90vw, 56vh, 540px); aspect-ratio:1/1; touch-action:none; user-select:none;
    background:#fff; border-radius:12px; box-shadow:var(--shadow);
  }
  /* Клетките са с фиксиран размер (minmax(0,1fr) + overflow:hidden), за да не се
     разтягат редовете, когато героят-емоджи влезе в тях — иначе стените „подскачат“. */
  .mz{ box-sizing:border-box; display:flex; align-items:center; justify-content:center; font-size:var(--mzf); line-height:1;
    min-width:0; min-height:0; overflow:hidden; }
  .mz.trail{ background:#e6f2ff; }
  .mz.hintp{ background:#fff3c4; }
  .mz.goal{ background:#e6f7ec; }
</style>
</head>
<body>

  <div class="mx-title">🧠 Внимание и памет</div>
  <span class="mx-badge">⭐ <span id="mx-stars">0</span></span>

  <button id="mx-back" class="mx-pill" hidden onclick="goMenu()">↩ Игри</button>

<section id="menu" class="mx-screen active">
  <h1 class="mx-h1">Внимание и памет 🧠</h1>

  <div class="mx-tiles">
    <button class="mx-tile g5" onclick="openMode('memory')"><span class="i">🃏</span><span class="l">Намери двойките</span><span class="s">Memory</span></button>
    <button class="mx-tile g4" onclick="openMode('sortirane')"><span class="i">🧺</span><span class="l">Подреди в кошниците</span><span class="s">Сортиране</span></button>

    <button class="mx-tile g6" onclick="openMode('poredica')"><span class="i">1️⃣2️⃣3️⃣</span><span class="l">Какво става после?</span><span class="s">Подреди картинките</span></button>
    <button class="mx-tile g7" onclick="openMode('simon')"><span class="i">🔴🔵🟢</span><span class="l">Повтори реда</span><span class="s">Гледай и запомни</span></button>

    <button class="mx-tile g1" onclick="openMode('labirint')"><span class="i">🐭🧀</span><span class="l">Лабиринт</span><span class="s">Намери пътя</span></button>

<section id="play" class="mx-screen">
  <div class="mx-levels" id="levels"></div>
  <div class="mx-card">
    <div class="mx-prompt"><span id="prompt"></span><button class="mx-say" onclick="sayPrompt()" aria-label="Кажи пак">🔊</button></div>

    <div class="mx-feedback" id="fb"></div>
    <div class="mx-row">
      <button class="mx-btn orange" id="hintBtn" onclick="hint()" hidden>💡 Подсказка</button>
      <button class="mx-btn green" id="nextBtn" onclick="newRound()" hidden>Още веднъж ▶</button>

<script>
const M = window.Maxi;
const store = M.createStore('maxiVnimanie_v1');
const area = document.getElementById('area');
let G;

const PICS = [['🐶','куче'],['🐱','котка'],['🐰','зайче'],['🐻','мечка'],['🦊','лисица'],['🐸','жаба'],['🐤','пиленце'],['🐟','рибка'],
  ['🍎','ябълка'],['🍌','банан'],['🍓','ягода'],['🍇','грозде'],['🚗','кола'],['🚌','автобус'],['🚀','ракета'],['⚽','топка'],
  ['🎈','балон'],['⭐','звезда'],['🌙','луна'],['☀️','слънце'],['🌸','цвете'],['🏠','къща'],['🧸','мече'],['🎁','подарък']];

const SORTS = [
  { name:'Плодове / Зеленчуци', baskets:[['🍎','Плодове',['🍎','🍌','🍓','🍇','🍐','🍊','🍒','🍉','🍋','🥝']],['🥕','Зеленчуци',['🥕','🥒','🍅','🥔','🌽','🥦','🧅','🫑','🥬','🧄']]] },
  { name:'Животни / Превозни средства', baskets:[['🐶','Животни',['🐶','🐱','🐮','🐷','🐴','🐑','🐔','🐰','🐻','🦁']],['🚗','Превозни средства',['🚗','🚌','🚆','✈️','🚢','🚲','🚀','🚜','🚒','🏍️']]] },
  { name:'Цветове', baskets:[['🔴','Червено',['🍎','🍓','🍒','🌹','🚒','❤️','🍅','🎈']],['🔵','Синьо',['🫐','🐳','💙','👖','🧢','💎','🌊','🔷']],['🟡','Жълто',['🍌','🌻','⭐','🐤','🍋','🌽','🧀','☀️']]] },
  { name:'Голямо / Малко', size:true, baskets:[['🐘','Голямо',[]],['🐭','Малко',[]]], pool:['🐶','🍎','⚽','🚗','⭐','🐱','🎈','🌸','🧸','🐟'] },
  { name:'Храна / Животни / Играчки', baskets:[['🍽️','Храна',['🍞','🧀','🍎','🍪','🥛','🍕','🥚','🍝']],['🐾','Животни',['🐶','🐱','🐮','🐸','🐟','🐦','🐒','🐢']],['🧸','Играчки',['🧸','⚽','🪀','🎲','🪁','🎈','🚂','🧩']]] }
];

const ODD_EASY = [['🍎','🍌'],['🐶','🐱'],['⭐','🌙'],['🚗','🚌'],['🌸','🍄'],['⚽','🏀'],['🐟','🐸'],['🎈','🎁']];
const ODD_HARD = [['😀','😃'],['🐤','🐥'],['🌼','🌻'],['🚗','🚙'],['🕐','🕑'],['⬆️','⬇️'],['🍏','🍎'],['🔵','🟣'],['👍','👎'],['🌕','🌝'],['🐱','😺'],['➡️','⬅️']];

const SEQ3 = [
  [['🥚','яйце'],['🐣','излюпва се'],['🐤','пиленце']],
  [['🌱','семе покълва'],['🌿','расте'],['🌳','дърво']],
  [['🥣','вземам купичка'],['🥛','сипвам мляко'],['😋','ям']],
  [['🧦','обувам чорапи'],['👟','обувам обувки'],['🚪','излизам']],
  [['🛒','пазарувам'],['💶','плащам'],['🏠','прибирам се']],
  [['🐭','малко'],['🐶','по-голямо'],['🐘','най-голямо']],
  [['🎁','получавам подарък'],['📦','отварям го'],['🧸','играя']],
  [['🧼','сапунисвам ръцете'],['🚰','изплаквам ги'],['🧻','избърсвам ги']]
];
const SEQ4 = [
  [['😴','събуждам се'],['🪥','мия зъбите'],['🥣','закусвам'],['🎒','тръгвам на училище']],
  [['🌅','сутрин'],['☀️','обед'],['🌇','вечер'],['🌙','нощ']],
  [['❄️','вали сняг'],['⛄','правя снежен човек'],['☀️','грее слънце'],['💧','снежният човек се стопява']],
  [['🥚','яйце'],['🐣','излюпва се'],['🐤','пиленце'],['🐓','петел']],
  [['🌱','засаждам семе'],['💧','поливам'],['🌷','цветето расте'],['💐','правя букет']],
  [['🍞','вземам хляб'],['🧈','мажа масло'],['🍯','слагам мед'],['😋','ям']],
  [['🐛','гъсеница'],['🍃','яде листа'],['😴','спи в пашкул'],['🦋','пеперуда']]
];

/* Повтори реда: цвят, име, тон, знак (знакът помага и при слабо цветово зрение). */
const PADS = [['#e74c3c','червено',330,'●'],['#3498db','синьо',392,'■'],['#27ae60','зелено',494,'▲'],['#f1c40f','жълто',587,'★']];
/* Ляво и дясно — имена с член, за да звучи естествено („вляво от котката“). */
const NAMED = [['🐶','кучето'],['🐱','котката'],['🐰','зайчето'],['🐻','мечката'],['🦊','лисицата'],['🐸','жабата'],['🐤','пиленцето'],
  ['🐟','рибката'],['🍎','ябълката'],['🍌','банана'],['🚗','колата'],['🚀','ракетата'],['⚽','топката'],['🎈','балона'],
  ['⭐','звездата'],['🌸','цветето'],['🏠','къщата'],['🧸','мечето'],['🎁','подаръка']];
/* Лабиринт: генериране с обхождане в дълбочина (винаги има точно един път). */
function makeMaze(N){
  const cells = Array.from({ length: N * N }, () => ({ n:1, s:1, e:1, w:1, v:false }));
  const at = (r, c) => cells[r * N + c];
  const stack = [[0, 0]];
  at(0, 0).v = true;
  while(stack.length){
    const [r, c] = stack[stack.length - 1];
    const nb = [[r - 1, c, 'n', 's'], [r + 1, c, 's', 'n'], [r, c + 1, 'e', 'w'], [r, c - 1, 'w', 'e']]
      .filter(([rr, cc]) => rr >= 0 && cc >= 0 && rr < N && cc < N && !at(rr, cc).v);
    if(!nb.length){ stack.pop(); continue; }
    const [rr, cc, d, o] = M.pick(nb);
    at(r, c)[d] = 0; at(rr, cc)[o] = 0; at(rr, cc).v = true;
    stack.push([rr, cc]);
  }
  return { N, at };
}
function mazePath(mz, from, to){
  const N = mz.N, prev = new Map(), key = (p) => p.r * N + p.c;
  const q = [from]; prev.set(key(from), null);
  while(q.length){
    const p = q.shift();
    if(p.r === to.r && p.c === to.c) break;
    const cell = mz.at(p.r, p.c);
    [[!cell.n, -1, 0], [!cell.s, 1, 0], [!cell.e, 0, 1], [!cell.w, 0, -1]].forEach(([open, dr, dc]) => {
      const np = { r: p.r + dr, c: p.c + dc };
      if(open && !prev.has(key(np))){ prev.set(key(np), p); q.push(np); }
    });
  }
  const path = [];
  for(let p = to; p; p = prev.get(key(p))) path.unshift(p);
  return path;
}
const MAZE_HEROES = [['🐭','🧀','мишлето','сиренето'],['🐰','🥕','зайчето','морковчето'],['🐶','🦴','кученцето','кокалчето'],['🐝','🌸','пчеличката','цветето'],['🚗','🏠','колата','къщата']];

const MODES = {
  /* ---------- Memory ---------- */
  memory: {
    levels: ['4 карти', '8 карти', '12 карти', '16 карти', 'Картинка + дума'],
    round(){
      const words = G.level === 4;
      const pairs = words ? 4 : [2, 4, 6, 8][G.level];
      const chosen = M.sample(PICS, pairs);
      let cards = [];
      chosen.forEach(([e, w], id) => {
        cards.push({ id, face: e, word: false, say: w });
        cards.push({ id, face: words ? w : e, word: words, say: w });
      });
      cards = M.shuffle(cards);
      const cols = cards.length <= 4 ? 2 : 4;
      G.setPrompt('Намери еднаквите двойки', words ? 'Намери картинката и думата, които си пасват.' : 'Обърни две карти и намери еднаквите.');
      const moves = document.createElement('div'); moves.className = 'moves'; moves.textContent = 'Ходове: 0';
      const grid = document.createElement('div'); grid.className = 'mem-grid';
      grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
      grid.style.maxWidth = cards.length <= 4 ? '360px' : (cards.length <= 8 ? '600px' : (cards.length <= 12 ? '560px' : '500px'));
      let open = [], busy = false, found = 0, count = 0;
      cards.forEach(c => {
        const b = document.createElement('button');
        b.className = 'mem-card';
        b.innerHTML = `<div class="mem-inner"><div class="mem-face mem-back">❔</div><div class="mem-face mem-front${c.word ? ' word' : ''}">${M.escapeHtml(c.face)}</div></div>`;
        b.onclick = () => {
          if(busy || b.classList.contains('open') || b.classList.contains('matched')) return;
          b.classList.add('open');
          M.click();
          M.speak(c.say, { rate: 1 });
          open.push([b, c]);
          if(open.length === 2){
            count++; moves.textContent = 'Ходове: ' + count;
            const [[b1, c1], [b2, c2]] = open;
            if(c1.id === c2.id){
              setTimeout(() => {
                b1.classList.add('matched'); b2.classList.add('matched');
                b1.classList.remove('open'); b2.classList.remove('open');
                M.good();
              }, 350);
              open = []; found++;
              if(found === pairs) setTimeout(() => complete(pairs + ' двойки за ' + count + ' хода', count, 'Намери всички двойки!', { noAuto: true }), 700);
            } else {
              busy = true;
              setTimeout(() => { b1.classList.remove('open'); b2.classList.remove('open'); open = []; busy = false; }, 1100);
            }
          }
        };
        grid.appendChild(b);
      });
      area.appendChild(moves);
      area.appendChild(grid);
    }
  },

  /* ---------- Сортиране ---------- */
  sortirane: {
    levels: SORTS.map(s => s.name),
    round(){
      const cfg = SORTS[G.level];
      const total = 6;
      let items;
      if(cfg.size){
        items = Array.from({ length: total }, () => ({ e: M.pick(cfg.pool), k: Math.random() < 0.5 ? 0 : 1 }));
      } else {
        items = [];
        const perBasket = cfg.baskets.map(b => M.shuffle(b[2]));
        for(let i = 0; i < total; i++){
          const k = i % cfg.baskets.length;
          items.push({ e: perBasket[k][Math.floor(i / cfg.baskets.length) % perBasket[k].length], k });
        }
        items = M.shuffle(items);
      }
      const names = cfg.baskets.map(b => b[1].toLowerCase());
      G.setPrompt('Сложи всяко нещо в правилната кошница', 'Сложи всяко нещо в правилната кошница: ' + names.join(' или ') + '.');
      const dots = document.createElement('div'); dots.className = 'progress-dots';
      dots.innerHTML = '<i></i>'.repeat(total);
      const itemEl = document.createElement('div'); itemEl.className = 'sort-item';
      const baskets = document.createElement('div'); baskets.className = 'baskets';
      let idx = 0;
      const showItem = () => {
        const it = items[idx];
        itemEl.textContent = it.e;
        itemEl.classList.toggle('small', !!cfg.size && it.k === 1);
      };
      cfg.baskets.forEach(([bh, bl], k) => {
        const b = document.createElement('button');
        b.className = 'basket';
        b.innerHTML = `<span class="bh">${bh}</span><span class="bl">${bl}</span><span class="bin"></span>`;
        b.onclick = () => {
          if(G.done() || idx >= items.length) return;
          const it = items[idx];
          if(it.k === k){
            b.querySelector('.bin').insertAdjacentHTML('beforeend', `<span class="mx-pop">${it.e}</span>`);
            dots.children[idx].classList.add('on');
            M.click();
            idx++;
            if(idx === items.length){ itemEl.textContent = '🎉'; itemEl.classList.remove('small'); complete(cfg.name, total - G.mistakes + '/' + total, 'Всичко е подредено!'); }
            else { M.speak(bl, { rate: 1 }); showItem(); }
          } else {
            G.mistakes++;
            M.bad();
            itemEl.classList.remove('bad'); void itemEl.offsetWidth; itemEl.classList.add('bad');
            M.speak('Не тук. Опитай в другата кошница.');
          }
        };
        baskets.appendChild(b);
      });
      area.appendChild(dots); area.appendChild(itemEl); area.appendChild(baskets);
      showItem();
    }
  },

  /* ---------- Кое е различното? ---------- */
  razlichno: {
    levels: ['9 картинки', '16 картинки', '25 трудно'],
    round(){
      const size = [3, 4, 5][G.level];
      const pool = G.level === 0 ? ODD_EASY : (G.level === 1 ? ODD_EASY.concat(ODD_HARD) : ODD_HARD);
      const pair = M.shuffle(M.pick(pool));
      const [same, odd] = pair;
      const oddAt = M.randInt(0, size * size - 1);
      G.setPrompt('Намери различната картинка');
      const grid = document.createElement('div'); grid.className = 'odd-grid';
      grid.style.gridTemplateColumns = `repeat(${size}, minmax(0,1fr))`;
      grid.style.maxWidth = [340, 440, 500][G.level] + 'px';
      for(let i = 0; i < size * size; i++){
        const b = document.createElement('button');
        b.className = 'odd-cell';
        b.textContent = i === oddAt ? odd : same;
        b.onclick = () => {
          if(G.done()) return;
          if(i === oddAt){ b.classList.add('ok'); complete(same + ' / ' + odd, odd); }
          else {
            G.mistakes++;
            M.bad();
            b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
            M.speak('Тази е като другите. Търси още.');
          }
        };
        grid.appendChild(b);
      }
      area.appendChild(grid);
      G.setHint(() => {
        const cells = M.$$('.odd-cell', grid);
        const row = Math.floor(oddAt / size);
        cells.forEach((c, i) => { if(Math.floor(i / size) !== row) c.style.opacity = '0.3'; });
        M.speak('Търси в този ред.');
      });
    }
  },

  /* ---------- Какво липсва? ---------- */
  lipsva: {
    levels: ['3 картинки', '4 картинки', '5 картинки'],
    round(){
      const n = G.level + 3;
      const items = M.sample(PICS, n);
      const missIdx = M.randInt(0, n - 1);
      const missing = items[missIdx];
      const row = document.createElement('div'); row.className = 'show-row';
      const draw = (hide) => {
        row.innerHTML = items.map((it, i) => `<div class="show-cell${hide && i === missIdx ? ' q' : ''}">${hide && i === missIdx ? '❓' : it[0]}</div>`).join('');
      };
      draw(false);
      G.setPrompt('Запомни картинките', 'Разгледай и запомни картинките. После натисни Готов съм.');
      area.appendChild(row);
      const ready = document.createElement('button');
      ready.className = 'mx-btn green'; ready.textContent = 'Готов съм ✓';
      area.appendChild(ready);
      ready.onclick = () => {
        ready.remove();
        draw(true);
        G.setPrompt('Какво липсва?');
        const others = M.sample(PICS.filter(p => !items.includes(p)), 2);
        optionButtons(M.shuffle([missing].concat(others)).map(([e, w]) => ({
          html: `<span class="e">${e}</span>`, value: e, label: w, speakOk: 'Липсваше ' + missing[1] + '.', speakBad: w + ' го нямаше.'
        })), missing[0], items.map(i => i[0]).join('') + ' без ' + missing[0], (it) => { if(it.value === missing[0]) draw(false); });
      };
    }
  },

  /* ---------- Последователности ---------- */
  poredica: {
    levels: ['3 картинки', '4 картинки'],
    round(){
      const seq = M.pick(G.level === 0 ? SEQ3 : SEQ4);
      G.setPrompt('Какво става първо, после и накрая?', 'Подреди картинките. Какво става първо?');
      const slots = document.createElement('div'); slots.className = 'seq-slots';
      seq.forEach((s, i) => { slots.insertAdjacentHTML('beforeend', `<div class="seq-slot"><span class="num">${i + 1}</span></div>`); });
      let order = seq.map((s, i) => i);
      for(let g = 0; g < 10 && order.every((v, i) => v === i); g++) order = M.shuffle(order);
      const cards = document.createElement('div'); cards.className = 'seq-slots';
      let next = 0;
      order.forEach(i => {
        const b = document.createElement('button');
        b.className = 'seq-card';
        b.innerHTML = `<span class="seq-e">${seq[i][0]}</span><span class="seq-t">${seq[i][1]}</span>`;
        b.onclick = () => {
          if(G.done() || b.classList.contains('used')) return;
          if(i === next){
            b.classList.add('used');
            const slot = slots.children[next];
            slot.classList.add('filled');
            slot.insertAdjacentHTML('beforeend', `<span class="seq-e">${seq[i][0]}</span><span class="seq-t">${seq[i][1]}</span>`);
            next++;
            if(next === seq.length) complete(seq.map(s => s[0]).join(' → '), '', seq.map(s => s[1]).join(', ') + '.');
            else { M.click(); M.speak(seq[i][1] + '. После?'); }
          } else {
            G.mistakes++;
            M.bad();
            b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad');
            M.speak(seq[i][1] + ' — не още. ' + (next === 0 ? 'Какво става първо?' : 'Какво става после?'));
          }
        };
        cards.appendChild(b);
      });
      area.appendChild(slots);
      area.appendChild(cards);
    }
  },

  /* ---------- Повтори реда (Саймън) ---------- */
  simon: {
    levels: ['От 2 до 5', 'От 3 до 6', 'Бързо до 7'],
    round(){
      const [startLen, goal, speed] = [[2, 5, 800], [3, 6, 680], [3, 7, 480]][G.level];
      const seq = [];
      while(seq.length < goal){
        const p = M.randInt(0, 3);
        if(seq.length >= 2 && seq[seq.length - 1] === p && seq[seq.length - 2] === p) continue; // без 3 еднакви поред
        seq.push(p);
      }
      const fb = document.getElementById('fb');
      const my = G.roundId;
      let len = startLen, pos = 0, busy = true;
      G.setPrompt('Гледай и повтори', 'Гледай светлините. После ги повтори.');
      const info = document.createElement('div'); info.className = 'moves';
      const grid = document.createElement('div'); grid.className = 'simon watch';
      const pads = PADS.map(([col, name, , sym], i) => {
        const b = document.createElement('button');
        b.className = 'pad'; b.style.background = col; b.textContent = sym; b.setAttribute('aria-label', name);
        b.onclick = () => press(i);
        grid.appendChild(b);
        return b;
      });
      const flash = (i, dur) => {
        pads[i].classList.add('lit');
        M.tone(PADS[i][2], Math.max(0.12, dur / 1000 * 0.85));
        setTimeout(() => pads[i].classList.remove('lit'), dur);
      };
      const play = (delay) => {
        busy = true; pos = 0;
        grid.classList.add('watch');
        info.textContent = 'Светлини: ' + len + ' от ' + goal;
        M.feedback(fb, '👀 Гледай…');
        seq.slice(0, len).forEach((p, k) => setTimeout(() => { if(my === G.roundId) flash(p, speed * 0.75); }, delay + k * speed));
        setTimeout(() => {
          if(my !== G.roundId) return;
          busy = false; grid.classList.remove('watch');
          M.feedback(fb, '👆 Твой ред!');
        }, delay + len * speed);
      };
      function press(i){
        if(busy || G.done()) return;
        flash(i, 260);
        if(i === seq[pos]){
          pos++;
          if(pos < len) return;
          busy = true;
          if(len === goal){ setTimeout(() => complete('Повтори ' + goal, goal, 'Запомни ' + M.num(goal, 'f') + ' светлини!'), 400); return; }
          len++;
          M.feedback(fb, '✅ Браво! Още една.', 'ok');
          setTimeout(() => { if(my === G.roundId) play(0); }, 1000);
        } else {
          busy = true;
          G.mistakes++;
          setTimeout(M.bad, 200);
          M.feedback(fb, 'Опа! Гледай пак.', 'bad');
          M.speak('Гледай пак.');
          setTimeout(() => { if(my === G.roundId) play(0); }, 1400);
        }
      }
      area.appendChild(info);
      area.appendChild(grid);
      play(2200);
      G.setHint(() => { if(!busy){ M.speak('Ето пак.'); play(600); } });
    }
  },

  /* ---------- Ляво и дясно ---------- */
  lyavo: {
    levels: ['Вляво или вдясно?', 'До кого е?', 'Ред от 5'],
    round(){
      if(G.level === 0){
        const [e, n] = M.pick(NAMED);
        const left = Math.random() < 0.5;
        G.setPrompt('Къде е ' + e + ' — вляво или вдясно от детето?', 'Къде е ' + n + '? Вляво или вдясно от детето?');
        area.insertAdjacentHTML('beforeend', `<div class="lr-row"><div class="lr-cell">${left ? e : ''}</div><div class="lr-cell">🧒</div><div class="lr-cell">${left ? '' : e}</div></div>`);
        const why = n.charAt(0).toUpperCase() + n.slice(1) + ' е ' + (left ? 'вляво' : 'вдясно') + '.';
        const box = optionButtons([
          { html: '<span class="e">⬅️</span>Вляво', value: 'L', label: 'вляво', speakOk: why },
          { html: '<span class="e">➡️</span>Вдясно', value: 'R', label: 'вдясно', speakOk: why }
        ], left ? 'L' : 'R', n + (left ? ' вляво' : ' вдясно'));
        G.setHint(() => {
          const b = box.children[0];
          b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
          M.speak('Това е лявата страна.');
        });
        return;
      }
      const n = G.level === 1 ? 3 : 5;
      const items = M.sample(NAMED, n);
      let ref, dir, ti;
      if(G.level === 1){ ref = 1; dir = M.pick([-1, 1]); }
      else { ref = M.randInt(0, 4); dir = ref === 0 ? 1 : (ref === 4 ? -1 : M.pick([-1, 1])); }
      ti = ref + dir;
      const side = dir < 0 ? 'вляво' : 'вдясно';
      const [re, rn] = items[ref], [te, tn] = items[ti];
      G.setPrompt('Какво има точно ' + side + ' от ' + re + '?', 'Какво има точно ' + side + ' от ' + rn + '?');
      const wrap = document.createElement('div'); wrap.className = 'lr-row opts';
      area.appendChild(wrap);
      const why = (side === 'вляво' ? 'Вляво' : 'Вдясно') + ' от ' + rn + ' е ' + tn + '.';
      const box = optionButtons(items.map(([e, nm], i) => ({
        html: `<span class="e">${e}</span>`, value: i, label: nm, cls: i === ref ? 'ref' : '',
        speakOk: why, speakBad: i === ref ? 'Това е ' + nm + '. Търсим до него.' : 'Това е ' + nm + '.'
      })), ti, re + ' ' + side + ' → ' + te, null, wrap);
      G.setHint(() => {
        const b = box.children[ref];
        b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
        M.speak('Намери ' + rn + ' и погледни ' + (dir < 0 ? 'наляво' : 'надясно') + '.');
      });
    }
  },

  /* ---------- Лабиринт ---------- */
  labirint: {
    levels: ['4 × 4', '6 × 6', '8 × 8'],
    round(){
      const N = [4, 6, 8][G.level];
      const mz = makeMaze(N);
      const [hero, prize, heroN, prizeN] = M.pick(MAZE_HEROES);
      const goal = { r: N - 1, c: N - 1 };
      let pos = { r: 0, c: 0 }, steps = 0, dragging = false, lastBump = 0;
      G.setPrompt('Заведи ' + hero + ' до ' + prize, 'Плъзни пръстче и заведи ' + heroN + ' до ' + prizeN + '.');
      const box = document.createElement('div'); box.className = 'maze';
      box.style.gridTemplateColumns = `repeat(${N}, minmax(0, 1fr))`;
      box.style.gridTemplateRows = `repeat(${N}, minmax(0, 1fr))`;
      const W = '3px solid #2c3e50';
      const els = [];
      for(let r = 0; r < N; r++) for(let c = 0; c < N; c++){
        const cell = mz.at(r, c);
        const d = document.createElement('div'); d.className = 'mz';
        if(cell.n) d.style.borderTop = W;
        if(cell.w) d.style.borderLeft = W;
        if(c === N - 1 && cell.e) d.style.borderRight = W;
        if(r === N - 1 && cell.s) d.style.borderBottom = W;
        box.appendChild(d); els.push(d);
      }
      const el = (p) => els[p.r * N + p.c];
      el(goal).classList.add('goal'); el(goal).textContent = prize;
      el(pos).textContent = hero;
      const clearHint = () => els.forEach(x => x.classList.remove('hintp'));
      const move = (np) => {
        el(pos).classList.add('trail');
        if(!(pos.r === goal.r && pos.c === goal.c)) el(pos).textContent = '';
        pos = np; steps++;
        el(pos).textContent = hero;
        M.tone(520 + (steps % 6) * 40, 0.04, 'triangle');
        if(pos.r === goal.r && pos.c === goal.c){
          dragging = false; clearHint();
          complete('Лабиринт ' + N + '×' + N, steps + ' стъпки', heroN.charAt(0).toUpperCase() + heroN.slice(1) + ' стигна до ' + prizeN + '!');
        }
      };
      const handle = (e) => {
        if(G.done()) return;
        const r = box.getBoundingClientRect();
        const c = Math.floor((e.clientX - r.left) / r.width * N), rr = Math.floor((e.clientY - r.top) / r.height * N);
        if(c < 0 || rr < 0 || c >= N || rr >= N) return;
        // Пръстчето може да прескочи клетки при бързо движение — вървим стъпка по стъпка натам, докъдето пътят е отворен.
        for(let guard = 0; guard < N * 2 && !G.done(); guard++){
          const dr = rr - pos.r, dc = c - pos.c;
          if(!dr && !dc) return;
          const cell = mz.at(pos.r, pos.c);
          const tryStep = (sr, sc) => {
            if(!sr && !sc) return false;
            const open = sr === -1 ? !cell.n : sr === 1 ? !cell.s : sc === 1 ? !cell.e : !cell.w;
            if(open) move({ r: pos.r + sr, c: pos.c + sc });
            return open;
          };
          const vFirst = Math.abs(dr) >= Math.abs(dc);
          const a = vFirst ? [Math.sign(dr), 0] : [0, Math.sign(dc)];
          const b = vFirst ? [0, Math.sign(dc)] : [Math.sign(dr), 0];
          if(tryStep(a[0], a[1]) || tryStep(b[0], b[1])) continue;
          if(Date.now() - lastBump > 500){ lastBump = Date.now(); M.tone(180, 0.08); }
          return;
        }
      };
      box.addEventListener('pointerdown', (e) => {
        // Започваме само от героя или до него — иначе едно докосване в далечината би изминало пътя вместо детето.
        const r = box.getBoundingClientRect();
        const c = Math.floor((e.clientX - r.left) / r.width * N), rr = Math.floor((e.clientY - r.top) / r.height * N);
        if(Math.abs(rr - pos.r) + Math.abs(c - pos.c) > 1){ M.speak('Започни от ' + heroN + '.'); return; }
        dragging = true; try{ box.setPointerCapture(e.pointerId); }catch(x){} handle(e);
      });
      box.addEventListener('pointermove', (e) => { if(dragging) handle(e); });
      ['pointerup', 'pointercancel'].forEach(t => box.addEventListener(t, () => { dragging = false; }));
      area.appendChild(box);
      // Емоджито е 62% от клетката — винаги се събира, на всеки екран.
      const fitFont = () => { if(box.isConnected) box.style.setProperty('--mzf', Math.max(10, box.clientWidth / N * 0.62).toFixed(1) + 'px'); };
      fitFont();
      window.addEventListener('resize', fitFont);
      G.onLeave = () => window.removeEventListener('resize', fitFont);
      G.setHint(() => {
        clearHint();
        mazePath(mz, pos, goal).slice(1, 1 + Math.max(3, Math.floor(N * 0.75))).forEach(p => el(p).classList.add('hintp'));
        M.speak('Следвай жълтите квадратчета.');
      });
    }
  }
};

G = M.createGame(store, MODES);
M.show('menu');
</script>
