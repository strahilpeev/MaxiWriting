<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b26b"/>
      <stop offset="50%" stop-color="#5da8e8"/>
      <stop offset="100%" stop-color="#4f9350"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Full-bleed background (no rounded corners - the OS mask handles shape) -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- Content kept inside the ~80% safe zone (center 410x410) -->
  <g filter="url(#soft-shadow)">
    <polygon points="256,168 380,234 256,300 132,234" fill="#ffffff"/>
    <rect x="188" y="278" width="136" height="52" rx="15" fill="#ffffff"/>
    <line x1="330" y1="234" x2="330" y2="316" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    <circle cx="330" cy="330" r="14" fill="#ffd85c"/>
  </g>

  <g transform="translate(342,140) scale(0.95)">
    <path d="M20 0 L25.5 14 L40 14.5 L28.5 23.5 L32.5 38 L20 29.5 L7.5 38 L11.5 23.5 L0 14.5 L14.5 14 Z"
          fill="#ffd85c" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
