<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2b26b"/>
      <stop offset="50%" stop-color="#5da8e8"/>
      <stop offset="100%" stop-color="#4f9350"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Graduation cap (learning symbol) -->
  <g filter="url(#soft-shadow)">
    <!-- cap top (diamond) -->
    <polygon points="256,128 400,206 256,284 112,206" fill="#ffffff"/>
    <!-- band -->
    <rect x="176" y="252" width="160" height="62" rx="18" fill="#ffffff"/>
    <!-- tassel string -->
    <line x1="352" y1="206" x2="352" y2="300" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="352" cy="316" r="16" fill="#ffd85c"/>
  </g>

  <!-- Star badge -->
  <g transform="translate(372,110) scale(1.15)">
    <path d="M20 0 L25.5 14 L40 14.5 L28.5 23.5 L32.5 38 L20 29.5 L7.5 38 L11.5 23.5 L0 14.5 L14.5 14 Z"
          fill="#ffd85c" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
</svg>
